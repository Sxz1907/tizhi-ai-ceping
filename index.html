<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="5gMHE5QHniYr3mMP7dtPha">
<head data-page-node-id="fkYo5JFPsxxe5KBqiPTzbo">
<meta charset="UTF-8" data-page-node-id="TsVWg45ykW7dsnrhKp85aq">
<meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="VGTyCM7Uc1jZZUna0PDV42">
<title>体质健康 AI 测评与个性化运动处方系统 · 参赛演示版</title>
<style>
:root{
  --bg:#eef2f8;
  --panel:#ffffff;
  --sidebar:#132338;
  --sidebar-2:#1c2f49;
  --side-txt:#93a7c0;
  --side-txt-on:#ffffff;
  --text:#16202f;
  --text-2:#5d6d85;
  --text-3:#8b99ad;
  --line:#e2e9f3;
  --line-2:#d3ddec;
  --brand:#2563eb;
  --brand-d:#1d4ed8;
  --brand-l:#e8f0ff;
  --cyan:#0891b2;
  --cyan-l:#e0f6fa;
  --ok:#15803d;
  --ok-l:#e7f6ed;
  --warn:#b45309;
  --warn-l:#fef3c7;
  --bad:#b91c1c;
  --bad-l:#fee2e2;
  --purple:#6d28d9;
  --purple-l:#f1e9fe;
  --r:14px;
  --sh:0 1px 3px rgba(19,35,56,.06),0 6px 22px rgba(19,35,56,.06);
  --sh-2:0 4px 14px rgba(19,35,56,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC",sans-serif;
  background:var(--bg);color:var(--text);
  font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#c3cedd;border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:#a8b6cb}
::-webkit-scrollbar-track{background:transparent}

/* ============ 布局 ============ */
#app{display:flex;height:100vh;width:100vw;overflow:hidden}
#sidebar{
  width:236px;flex:0 0 236px;height:100vh;
  background:linear-gradient(178deg,#132338 0%,#16283f 62%,#182f4b 100%);
  display:flex;flex-direction:column;
  color:var(--side-txt);
  box-shadow:2px 0 18px rgba(19,35,56,.16);
  z-index:20;
}
.sb-brand{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-logo{display:flex;align-items:center;gap:11px}
.sb-mark{
  width:38px;height:38px;border-radius:11px;flex:0 0 38px;
  background:linear-gradient(140deg,#3b82f6,#06b6d4);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(37,99,235,.4);
}
.sb-title{font-size:15px;font-weight:700;color:#fff;letter-spacing:.3px;line-height:1.3}
.sb-sub{font-size:11px;color:#7f95b3;margin-top:2px;letter-spacing:.5px}
.sb-nav{flex:1;padding:12px 10px;overflow-y:auto;overflow-x:hidden}
.sb-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14)}
.sb-cap{
  font-size:11px;color:#5f7594;letter-spacing:1.4px;
  padding:14px 10px 7px;font-weight:600;text-transform:uppercase;
}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:10px 11px;margin:2px 0;border-radius:10px;
  cursor:pointer;user-select:none;position:relative;
  transition:background .16s,color .16s,transform .16s;
  font-size:14.5px;color:var(--side-txt);
}
.nav-item:hover{background:rgba(255,255,255,.055);color:#dbe6f5}
.nav-item.on{
  background:linear-gradient(92deg,rgba(37,99,235,.94),rgba(14,165,233,.72));
  color:#fff;font-weight:600;
  box-shadow:0 3px 12px rgba(37,99,235,.34);
}
.nav-item.on::before{
  content:"";position:absolute;left:-10px;top:50%;transform:translateY(-50%);
  width:3px;height:22px;background:#38bdf8;border-radius:0 3px 3px 0;
}
.nav-ico{width:20px;height:20px;flex:0 0 20px;display:flex;align-items:center;justify-content:center}
.nav-ico svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.nav-item.on .nav-ico svg{opacity:1;stroke-width:1.9}
.nav-badge{
  margin-left:auto;font-size:10.5px;padding:1px 6px;border-radius:20px;
  background:rgba(245,158,11,.18);color:#fbbf24;font-weight:600;letter-spacing:.2px;
}
.nav-item.on .nav-badge{background:rgba(255,255,255,.22);color:#fff}
.sb-foot{padding:12px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#5f7594;line-height:1.65}
.sb-foot b{color:#8ea6c6;font-weight:600}

/* ============ 主区 ============ */
#main{flex:1;display:flex;flex-direction:column;height:100vh;min-width:0;overflow:hidden}
#topbar{
  height:60px;flex:0 0 60px;background:rgba(255,255,255,.92);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;padding:0 24px;gap:16px;z-index:10;
}
.tb-title{font-size:19px;font-weight:700;letter-spacing:.2px}
.tb-desc{font-size:12.5px;color:var(--text-3);margin-left:2px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.demo-chip{
  display:flex;align-items:center;gap:6px;
  background:var(--warn-l);color:var(--warn);
  border:1px solid #fcd9a0;border-radius:20px;
  padding:5px 13px;font-size:12.5px;font-weight:600;
}
.role-sw{display:flex;background:#eaf0f9;border-radius:10px;padding:3px;gap:2px}
.role-b{
  border:none;background:transparent;cursor:pointer;
  padding:6px 14px;border-radius:8px;font-size:13px;color:var(--text-2);
  font-family:inherit;transition:all .15s;font-weight:500;
}
.role-b:hover{color:var(--brand)}
.role-b.on{background:#fff;color:var(--brand);font-weight:700;box-shadow:0 1px 4px rgba(19,35,56,.12)}
#view{
  flex:1;overflow-y:auto;overflow-x:hidden;padding:22px 26px 40px;
  scroll-behavior:smooth;
}

/* ============ 通用元件 ============ */
.card{
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--sh);
  padding:20px 22px;
}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h h3{font-size:16.5px;font-weight:700;letter-spacing:.2px}
.card-h .sub{font-size:12.5px;color:var(--text-3);font-weight:400;margin-left:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--brand);flex:0 0 7px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g21{grid-template-columns:1.55fr 1fr}
.g12{grid-template-columns:1fr 1.55fr}
.mb16{margin-bottom:16px}
.mb20{margin-bottom:20px}
.mt12{margin-top:12px}
.row{display:flex;align-items:center;gap:12px}
.wrap{flex-wrap:wrap}

.kpi{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:17px 18px;box-shadow:var(--sh);position:relative;overflow:hidden;
}
.kpi::after{
  content:"";position:absolute;right:-24px;top:-24px;width:78px;height:78px;
  border-radius:50%;background:var(--brand-l);opacity:.62;
}
.kpi.blue::after{background:var(--brand-l)}
.kpi.green::after{background:var(--ok-l)}
.kpi.amber::after{background:var(--warn-l)}
.kpi.cyan::after{background:var(--cyan-l)}
.kpi.purple::after{background:var(--purple-l)}
.kpi-l{font-size:12.5px;color:var(--text-2);font-weight:500;position:relative;z-index:1}
.kpi-v{font-size:31px;font-weight:800;letter-spacing:-.5px;margin:3px 0 1px;position:relative;z-index:1;line-height:1.1}
.kpi-u{font-size:13px;font-weight:600;color:var(--text-3);margin-left:3px}
.kpi-s{font-size:11.5px;color:var(--text-3);position:relative;z-index:1}
.kpi-v.b{color:var(--brand)} .kpi-v.g{color:var(--ok)} .kpi-v.a{color:var(--warn)}
.kpi-v.c{color:var(--cyan)} .kpi-v.p{color:var(--purple)}

.tag{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;line-height:1.5;
}
.t-b{background:var(--brand-l);color:var(--brand-d)}
.t-g{background:var(--ok-l);color:var(--ok)}
.t-a{background:var(--warn-l);color:var(--warn)}
.t-r{background:var(--bad-l);color:var(--bad)}
.t-c{background:var(--cyan-l);color:var(--cyan)}
.t-p{background:var(--purple-l);color:var(--purple)}
.t-n{background:#eef2f8;color:var(--text-2)}

.btn{
  border:1px solid var(--line-2);background:#fff;color:var(--text);
  padding:8px 16px;border-radius:9px;cursor:pointer;
  font-size:13.5px;font-family:inherit;font-weight:500;
  transition:all .15s;display:inline-flex;align-items:center;gap:7px;
}
.btn:hover{border-color:var(--brand);color:var(--brand);box-shadow:0 2px 8px rgba(37,99,235,.14)}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.pri:hover{background:var(--brand-d);color:#fff;box-shadow:0 4px 14px rgba(37,99,235,.3)}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:7px}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

table.tb{width:100%;border-collapse:collapse;font-size:14px}
table.tb th{
  text-align:left;padding:10px 12px;font-size:12.5px;font-weight:600;
  color:var(--text-2);border-bottom:2px solid var(--line-2);white-space:nowrap;
  background:#f7fafd;
}
table.tb td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tb tbody tr{transition:background .13s}
table.tb tbody tr:hover{background:#f6f9fd}
table.tb tbody tr.sel{background:var(--brand-l)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.tbl-wrap{max-height:420px;overflow-y:auto;border-radius:10px;border:1px solid var(--line)}
.tbl-wrap table.tb th{position:sticky;top:0;z-index:2;background:#f7fafd}

.bar-out{height:7px;background:#eaf0f9;border-radius:7px;overflow:hidden;min-width:56px}
.bar-in{height:100%;border-radius:7px;transition:width .5s cubic-bezier(.4,0,.2,1)}

.empty{
  text-align:center;padding:44px 20px;color:var(--text-3);font-size:14px;
}
.empty svg{width:44px;height:44px;stroke:#cbd7e6;fill:none;stroke-width:1.4;margin-bottom:10px}

.note{
  background:var(--brand-l);border-left:3px solid var(--brand);
  padding:11px 15px;border-radius:0 9px 9px 0;font-size:13px;color:#1e40af;line-height:1.62;
}
.note.amber{background:var(--warn-l);border-color:var(--warn);color:#92400e}
.note.cyan{background:var(--cyan-l);border-color:var(--cyan);color:#155e75}
.note.purple{background:var(--purple-l);border-color:var(--purple);color:#5b21b6}
.note b{font-weight:700}

/* ---- 训练打卡模块 ---- */
.ck-item{display:flex;align-items:center;gap:9px;padding:8px 12px;background:#f7fafd;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;font-size:13.5px}
.ck-dot{width:9px;height:9px;border-radius:50%;flex:none}
.ck-name{flex:1;font-weight:600}
.ck-sc{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.ck-label{font-size:12.5px;color:var(--text-2);font-weight:600;margin:6px 0 8px}
.ck-btns{display:flex;gap:10px;flex-wrap:wrap}
.ck-b{flex:1;min-width:92px;border:1px solid var(--line-2);background:#fff;color:var(--text);padding:11px 8px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;font-family:inherit;transition:all .15s}
.ck-b:hover{border-color:var(--brand);color:var(--brand)}
.ck-b.on{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 4px 14px rgba(37,99,235,.28)}
.ck-input{width:100%;margin-top:12px;padding:10px 12px;border:1px solid var(--line-2);border-radius:9px;font-size:13.5px;font-family:inherit;background:#fff;color:var(--text)}
.ck-input::placeholder{color:var(--text-3)}
.ck-done{margin-top:12px;background:var(--ok-l);border:1px solid var(--ok);border-radius:10px;padding:13px 15px}
.ck-badge{display:inline-flex;align-items:center;gap:6px;background:var(--ok);color:#fff;font-weight:700;font-size:13px;padding:5px 12px;border-radius:20px;margin-bottom:10px}
.ck-done-row{font-size:13.5px;color:#14532d;margin-top:5px;line-height:1.55}
.ck-done-row b{color:#166534}
.ck-time{font-size:11.5px;color:#3f7a52;margin-top:7px}
.ck-exec-foot{margin-top:14px;border-top:1px dashed var(--line-2);padding-top:13px}
.ck-sub{font-size:12.5px;color:var(--text-2);font-weight:600;margin-bottom:9px;display:flex;align-items:center;gap:10px}
.ck-toggle{border:1px solid var(--line-2);background:#fff;color:var(--brand);padding:3px 12px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:600;font-family:inherit}
.ck-list{display:flex;flex-wrap:wrap;gap:8px;max-height:92px;overflow:hidden;transition:max-height .25s ease}
.ck-list.open{max-height:560px;overflow-y:auto}
.ck-chip{display:inline-flex;flex-direction:column;gap:1px;background:var(--warn-l);color:#92400e;border:1px solid var(--warn);border-radius:9px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;line-height:1.3;transition:all .15s}
.ck-chip:hover{box-shadow:0 2px 10px rgba(245,158,11,.25);transform:translateY(-1px)}
.ck-chip i{font-style:normal;font-size:11px;font-weight:500;opacity:.8}
.ck-all{color:var(--ok);font-weight:600;font-size:13.5px}

/* 步骤条 */
.steps{display:flex;align-items:center;gap:0;margin:6px 0 4px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:9px}
.step-n{
  width:27px;height:27px;border-radius:50%;flex:0 0 27px;
  background:var(--brand);color:#fff;font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.step-t{font-size:13.5px;color:var(--text-2);font-weight:500}
.step-line{width:34px;height:2px;background:var(--line-2);margin:0 11px;border-radius:2px}

/* 学生卡 */
.stu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:11px}
.stu-c{
  border:1px solid var(--line);border-radius:11px;padding:12px 14px;cursor:pointer;
  transition:all .15s;background:#fff;position:relative;
}
.stu-c:hover{border-color:var(--brand);box-shadow:0 3px 12px rgba(37,99,235,.13);transform:translateY(-1px)}
.stu-c.on{border-color:var(--brand);background:var(--brand-l);box-shadow:0 3px 12px rgba(37,99,235,.16)}
.stu-nm{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.stu-id{font-size:11.5px;color:var(--text-3);margin-top:1px}
.stu-sc{font-size:23px;font-weight:800;line-height:1.15;margin-top:7px}
.stu-meta{font-size:11.5px;color:var(--text-3);margin-top:2px}

/* 对话 */
.chat-box{
  background:linear-gradient(180deg,#fbfdff,#f6fafd);
  border:1px solid var(--line);border-radius:12px;
  padding:16px;height:352px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;
}
.msg{max-width:78%;padding:10px 14px;border-radius:13px;font-size:14px;line-height:1.68;white-space:pre-wrap;word-break:break-word}
.msg.ai{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px;box-shadow:0 1px 4px rgba(19,35,56,.05)}
.msg.me{background:var(--brand);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg-who{font-size:11px;color:var(--text-3);margin-bottom:3px;font-weight:600}
.chat-in{display:flex;gap:9px;align-items:flex-end}
.chat-in textarea{
  flex:1;border:1px solid var(--line-2);border-radius:10px;padding:10px 13px;
  font-family:inherit;font-size:14px;resize:none;height:44px;outline:none;
  transition:border-color .15s;background:#fff;color:var(--text);line-height:1.5;
}
.chat-in textarea:focus{border-color:var(--brand)}
.q-chips{display:flex;gap:7px;flex-wrap:wrap}
.q-chip{
  border:1px solid var(--line-2);background:#fff;border-radius:20px;
  padding:6px 13px;font-size:12.5px;cursor:pointer;color:var(--text-2);
  transition:all .15s;font-family:inherit;
}
.q-chip:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-l)}

/* 处方 */
.rx-sec{border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:12px}
.rx-h{
  background:linear-gradient(92deg,#f7fafd,#eef4fc);padding:9px 15px;
  font-size:13.5px;font-weight:700;color:var(--brand-d);
  display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);
}
.rx-b{padding:13px 16px;font-size:14px;line-height:1.75;background:#fff}
.rx-item{
  display:flex;gap:11px;padding:8px 0;border-bottom:1px dashed var(--line);
}
.rx-item:last-child{border-bottom:none}
.rx-item-n{
  flex:0 0 22px;width:22px;height:22px;border-radius:6px;background:var(--brand-l);
  color:var(--brand-d);font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;margin-top:2px;
}
.rx-item-t{flex:1}
.rx-item-t b{font-weight:700}
.rx-dose{font-size:12px;color:var(--text-3);margin-top:2px}

/* 溯源 */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line-2);border-radius:2px}
.tl-i{position:relative;padding-bottom:18px}
.tl-i::before{
  content:"";position:absolute;left:-23px;top:5px;width:12px;height:12px;border-radius:50%;
  background:#fff;border:2.5px solid var(--brand);
}
.tl-i.ai::before{border-color:var(--cyan)}
.tl-i.hu::before{border-color:var(--purple)}
.tl-t{font-size:14.5px;font-weight:700;margin-bottom:3px}
.tl-d{font-size:13px;color:var(--text-2);line-height:1.65}

.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--text-2)}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

.hint{font-size:12.5px;color:var(--text-3);line-height:1.65}
.footnote{
  margin-top:22px;padding:14px 17px;border-radius:11px;
  background:#f7fafd;border:1px dashed var(--line-2);
  font-size:12.5px;color:var(--text-2);line-height:1.7;
}
kbd{
  background:#fff;border:1px solid var(--line-2);border-bottom-width:2px;
  border-radius:5px;padding:1px 6px;font-size:11.5px;font-family:ui-monospace,Consolas,monospace;color:var(--text-2);
}
.scroll-x{overflow-x:auto}
.mini-in{
  width:100%;border:1px solid var(--line-2);border-radius:6px;
  padding:5px 7px;font-family:inherit;font-size:13px;color:var(--text);
  text-align:right;outline:none;background:#fff;transition:border-color .14s,box-shadow .14s;
  font-variant-numeric:tabular-nums;
}
.mini-in:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.mini-in:hover{border-color:#a9bad2}
.mini-in.ro{background:#f7fafd;color:var(--text-2);border-style:dashed}
.flash{animation:flashBg .9s ease-out}
@keyframes flashBg{0%{background:#fff9e6}100%{background:#fff}}
.seg{display:flex;background:#eaf0f9;border-radius:10px;padding:3px;gap:2px}
.seg-b{border:none;background:transparent;cursor:pointer;padding:6px 14px;border-radius:8px;
  font-size:13px;color:var(--text-2);font-family:inherit;transition:all .15s;font-weight:500}
.seg-b.on{background:#fff;color:var(--brand);font-weight:700;box-shadow:0 1px 4px rgba(19,35,56,.12)}

@keyframes fadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.fade{animation:fadeUp .34s cubic-bezier(.2,.7,.3,1) both}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.42}}
.puls{animation:pulse 1.5s ease-in-out infinite}
@media print{#sidebar,#topbar{display:none}#main{overflow:visible}#view{overflow:visible;padding:0}}

/* ---------- 纯净 / 讲解 双模式 ---------- */
body.clean .note-ex{display:none !important}
.mode-sw{display:flex;align-items:center;border:1px solid #dfe7f1;border-radius:8px;overflow:hidden;background:#fff;flex:none}
.mode-sw button{border:none;background:#fff;padding:5px 10px;font-size:11.5px;font-weight:700;
  color:#6b7d95;cursor:pointer;font-family:inherit;line-height:1.4}
.mode-sw button+button{border-left:1px solid #dfe7f1}
.mode-sw button.on{background:#1d4ed8;color:#fff}
.user-chip{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:#3d5067;
  background:#f1f5fb;border:1px solid #dfe7f1;border-radius:15px;padding:4px 11px;flex:none;white-space:nowrap}
.user-chip .out{color:#2563eb;cursor:pointer;font-weight:800;margin-left:3px}
.user-chip .out:hover{text-decoration:underline}

/* ---------- 登录 ---------- */
.login-mask{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(125deg,#0f2f5c 0%,#1d4ed8 55%,#0e7490 100%);padding:24px;
  font-family:"Microsoft YaHei","PingFang SC",sans-serif}
.login-mask.off{display:none}
.login-box{width:100%;max-width:920px;background:#fff;border-radius:18px;overflow:hidden;
  display:grid;grid-template-columns:1.08fr .92fr;box-shadow:0 26px 70px rgba(8,25,50,.36)}
.login-l{background:#f6f9fd;padding:34px 32px;border-right:1px solid #e6edf6}
.login-brand{display:flex;align-items:center;gap:12px;color:#1d4ed8;margin-bottom:18px}
.login-note{font-size:13px;line-height:1.9;color:#5d6d85;margin-bottom:20px}
.login-note b{color:#1d4ed8}
.login-roles{display:flex;flex-direction:column;gap:9px}
.lr-c{border:1px solid #dfe7f1;border-radius:11px;padding:12px 14px;cursor:pointer;background:#fff;
  transition:border-color .16s,box-shadow .16s}
.lr-c:hover{border-color:#93b4f5;box-shadow:0 3px 12px rgba(29,78,216,.1)}
.lr-c.on{border-color:#1d4ed8;box-shadow:0 0 0 2px rgba(29,78,216,.14)}
.lr-t{font-size:14px;font-weight:800;color:#12202f;display:flex;align-items:center;gap:8px}
.lr-t .tagx{font-size:10.5px;font-weight:700;border-radius:5px;padding:2px 7px;margin-left:auto}
.lr-d{font-size:12px;color:#6b7d95;margin-top:5px;line-height:1.65}
.lr-a{font-size:11.5px;color:#94a3b8;margin-top:6px;font-family:Consolas,monospace}
.login-tip{font-size:11.5px;color:#94a3b8;margin-top:16px;line-height:1.7}
.login-r{padding:34px 32px;display:flex;flex-direction:column;justify-content:center}
.login-h{font-size:19px;font-weight:800;color:#12202f}
.login-sub{font-size:12.5px;color:#8b99ad;margin:5px 0 22px}
.login-lb{font-size:12px;font-weight:700;color:#3d5067;margin-bottom:6px}
.login-in{width:100%;border:1px solid #d8e2ef;border-radius:9px;padding:11px 13px;font-size:14px;
  font-family:inherit;color:#12202f;outline:none;margin-bottom:15px;background:#fbfcfe}
.login-in:focus{border-color:#2563eb;background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.11)}
.login-err{min-height:19px;font-size:12.5px;color:#dc2626;font-weight:600;margin-bottom:8px}
.login-btn{width:100%;background:#1d4ed8;color:#fff;border:none;border-radius:9px;padding:12px;
  font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;letter-spacing:2px}
.login-btn:hover{background:#1e40af}
.login-foot{font-size:11.5px;color:#94a3b8;text-align:center;margin-top:16px;line-height:1.7}

/* ---------- 扫码进入 / 手机实时上传 ---------- */
.qr-btn{display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px solid #d3ddec;border-radius:15px;
  background:#fff;color:#1d4ed8;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.qr-btn:hover{background:#eef3ff;border-color:#b9ccf6}
.qr-card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px;border:1px solid #e6edf6;
  border-radius:12px;background:#fbfdff;margin-top:14px}
.qr-card svg{display:block;width:172px;height:172px;border:1px solid #eef2f8;border-radius:8px;background:#fff}
.qr-cap{font-size:13px;font-weight:800;color:#12202f}
.qr-url{font-size:11px;color:#6b7d95;font-family:Consolas,monospace;word-break:break-all;text-align:center;line-height:1.5}
.qr-tip{font-size:11px;color:#94a3b8;text-align:center;line-height:1.6}
.qr-note{font-size:12px;color:#b45309;background:#fdf3e3;border:1px solid #f6dca0;border-radius:10px;padding:11px 13px;line-height:1.75}
.qr-modal{position:fixed;inset:0;z-index:9500;display:none;align-items:center;justify-content:center;
  background:rgba(10,20,40,.55);padding:20px}
.qr-modal.on{display:flex}
.qr-modal-box{background:#fff;border-radius:16px;padding:22px 24px;max-width:340px;width:100%;box-shadow:0 24px 60px rgba(8,25,50,.4)}
.qr-modal-h{display:flex;align-items:center;font-size:17px;font-weight:800;color:#12202f;margin-bottom:14px}
.qr-modal-x{margin-left:auto;cursor:pointer;font-size:22px;color:#94a3b8;line-height:1;padding:0 4px}
.qr-modal-box svg{display:block;width:240px;height:240px;margin:0 auto;border:1px solid #eef2f8;border-radius:10px;background:#fff}
.feed-wall{display:flex;flex-wrap:wrap;gap:12px;margin-top:4px}
.feed-empty{font-size:13px;color:#94a3b8;padding:18px 0;text-align:center;width:100%}

.feed-item img{display:block;width:100%;height:106px;object-fit:cover;background:#0f172a}
.feed-meta{font-size:11.5px;color:#3d5067;padding:7px 9px;line-height:1.5}
.feed-meta span{display:block;color:#94a3b8;font-size:10.5px;margin-top:2px}
.feed-demo .feed-meta span{color:#0ea5e9;font-weight:600}

.ask-bar{display:flex;gap:8px;margin-top:12px}
.ask-bar input{flex:1;border:1px solid #d8e2ef;border-radius:9px;padding:10px 13px;font-size:13.5px;

.ask-log .ab{align-self:flex-start;background:#f1f5fb;border:1px solid #e2e9f3;border-radius:11px 11px 11px 3px;

.ask-quick{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.ask-quick span{font-size:12px;color:#2563eb;background:#e8f0ff;border-radius:14px;padding:4px 11px;
  cursor:pointer;border:1px solid #d3e2ff}
.ask-quick span:hover{background:#d8e6ff}

.plog-s{font-weight:600;color:#16202f}
.plog-a{flex:none;font-size:12px;color:#8b99ad}
.plog-b{padding:0 12px 12px;border-top:1px solid #eef2f8}
.plog-raw{background:#f7f9fc;border:1px solid #e2e9f3;border-radius:8px;padding:10px 11px;font-size:12px;line-height:1.72;color:#334155;white-space:pre-wrap;word-break:break-word;margin:10px 0 8px;font-family:ui-monospace,Menlo,Consolas,monospace;max-height:190px;overflow:auto}
.plog-row{display:flex;gap:9px;padding:8px 0;font-size:12.5px;line-height:1.72;color:#5d6d85;border-top:1px dashed #eef2f8}
.plog-k{flex:none;width:58px;color:#1d4ed8;font-weight:600}
.plog-k.hu{color:#6d28d9}
.save-chip{display:flex;align-items:center;gap:6px;height:28px;padding:0 6px 0 10px;border-radius:14px;background:#eaf3de;border:1px solid #c0dd97;color:#3b6d11;font-size:12px;white-space:nowrap;line-height:1}
.save-chip.warn{background:#faeeda;border-color:#fac775;color:#854f0b}
.save-dot{width:6px;height:6px;border-radius:50%;background:#639922;flex:none}
.save-dot.warn{background:#ba7517}
.save-x{margin-left:2px;padding:3px 7px;border-radius:9px;background:rgba(59,109,17,.12);color:#3b6d11;font-size:11.5px;cursor:pointer;line-height:1.2}
.save-x:hover{background:rgba(59,109,17,.24)}
.save-x:active{background:rgba(59,109,17,.34)}
/* 访客模式提示条（底部浮层，可关闭） */
.guest-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:60;max-width:min(700px,92vw);background:#0f172a;color:#e2e8f0;border:1px solid #1e293b;box-shadow:0 12px 32px rgba(2,6,23,.38);border-radius:12px;padding:11px 40px 11px 16px;font-size:12.5px;line-height:1.65}
.guest-bar b{color:#7dd3fc;font-weight:700}
.gb-x{position:absolute;top:5px;right:10px;cursor:pointer;color:#94a3b8;font-size:17px;line-height:1;padding:0 3px}
.gb-x:hover{color:#e2e8f0}
.role-b.on[style]{cursor:default}
/* 演示路线导览（首页顶部，评委一键跟随） */
.tour{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tour-t{display:flex;align-items:center;font-size:12.5px;color:#5d6d85;font-weight:700;padding-right:4px;white-space:nowrap}
.tour-step{flex:1;min-width:150px;display:flex;align-items:center;gap:9px;background:#fff;border:1px solid #dce4f0;border-radius:11px;padding:10px 13px;cursor:pointer;transition:.15s;box-shadow:0 1px 2px rgba(16,35,56,.04)}
.tour-step:hover{border-color:#2563eb;box-shadow:0 4px 14px rgba(37,99,235,.12);transform:translateY(-1px)}
.tour-n{flex:none;width:24px;height:24px;border-radius:50%;background:#e8f0ff;color:#1d4ed8;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.tour-step b{font-size:13px;color:#16202f;display:block;line-height:1.2}
.tour-step span{font-size:11.5px;color:#8b99ad}
/* 处方已推送提示 */
.rx-pushed{display:flex;align-items:center;gap:8px;background:#eaf3de;border:1px solid #c0dd97;color:#3b6d11;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600;margin-bottom:12px}
.rx-pushed .ic{flex:none}
</style>

function itemName(gender, key){
  const nm = { strength: gender==="M" ? "引体向上" : "仰卧起坐",
               endur:    gender==="M" ? "1000 米跑" : "800 米跑" };

/* ---------------- 2. 评分引擎 ---------------- */
const SCORE_KEYS = [100,95,90,85,80,78,76,74,72,70,68,66,64,62,60,50,40,30,20,10];

function lookupScore(table, val, better){
  if (val === null || val === undefined || val === "" || isNaN(val)) return null;
  val = Number(val);
  for (let i=0;i<SCORE_KEYS.length;i++){
    const k = SCORE_KEYS[i];
    const t = table[k];
    if (t === undefined) continue;
    if (better === "high"  && val >= t) return k;
    if (better === "low"   && val <= t) return k;
  }
  return 0; // 低于最低档，记 0 分
}

function bmiScore(gender, bmi){
  const s = BMI_STD[gender];
  let score, grade;
  if (bmi < s.normalLow)      { score = 80; grade = "低体重"; }
  else if (bmi <= s.normalHigh){ score = 100; grade = "正常"; }
  else if (bmi <= s.over)     { score = 80; grade = "超重"; }
  else                        { score = 60; grade = "肥胖"; }
  return { score, grade };
}

/**
 * 计算单个学生单次测评的成绩
 * rec: { height, weight, vc, run50, reach, jump, strength, endur }
 */
function scoreOne(gender, rec){
  const T = STD[gender];
  const h = Number(rec.height)/100, w = Number(rec.weight);
  const bmi = (h>0 && w>0) ? +(w/(h*h)).toFixed(1) : null;
  const bip = bmi!=null ? bmiScore(gender, bmi) : {score:0,grade:"未测"};

  const parts = {
    bmi:      { score: bip.score,  raw: bmi,     better:"range", grade: bip.grade },
    vc:       { score: lookupScore(T.vc, rec.vc, "high"),        raw: Number(rec.vc)||0,       better:"high" },
    run50:    { score: lookupScore(T.run50, rec.run50, "low"),   raw: Number(rec.run50)||0,    better:"low"  },
    reach:    { score: lookupScore(T.reach, rec.reach, "high"),  raw: Number(rec.reach)||0,    better:"high" },
    jump:     { score: lookupScore(T.jump, rec.jump, "high"),    raw: Number(rec.jump)||0,     better:"high" },
    strength: { score: lookupScore(T[gender==="M"?"pullup":"situp"], rec.strength, "high"), raw: Number(rec.strength)||0, better:"high" },
    endur:    { score: lookupScore(T.endur, rec.endur, "low"),   raw: Number(rec.endur)||0,    better:"low"  }
  };

  let total = 0, done = 0;
  ITEMS.forEach(it=>{
    const p = parts[it.key];
    if (p && typeof p.score === "number") { total += p.score * it.w / 100; done++; }
  });
  total = Math.round(total*10)/10;

  let level;
  if      (total >= 90) level = "优秀";
  else if (total >= 80) level = "良好";
  else if (total >= 60) level = "及格";
  else                  level = "不及格";

  return { parts, bmi, bmiGrade: bip.grade, total, level, valid: done===ITEMS.length };
}

function lcg(seed){
  let s = seed >>> 0;
  return function(){ s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

// 围绕 0 的近似正态抖动（多均匀分布叠加）
function jitter(rnd, scale){
  return (rnd()+rnd()+rnd()-1.5) / 1.5 * scale;
}

function buildStudents(){
  const rnd = lcg(20260909);
  const list = [];
  let seqM = 0, seqF = 0;

  function makeRecord(gender, base, prog){
    // prog: 0/1/2 表示第几次测评，能力随时间小幅提升
    const g = 0.06 * prog;
    const r = {
      height: gender==="M" ? base.height : base.height,
      weight: Math.round((base.weight + jitter(rnd,1.0) + prog*0.55)*10)/10,
      vc:     Math.round(base.vc   * (1 + g) + jitter(rnd,  gender==="M"?190:120)),
      run50:  Math.round((base.run50 * (1 - g*0.42) + jitter(rnd, 0.26))*10)/10,
      reach:  Math.round((base.reach + jitter(rnd,1.9) + prog*0.85)*10)/10,
      jump:   Math.round(base.jump * (1 + g*0.62) + jitter(rnd, 7)),
      strength: Math.round(base.strength * (1 + g*1.05) + jitter(rnd, 1.15)),
      endur:  Math.round(base.endur * (1 - g*0.46) + jitter(rnd, gender==="M"?11:8))
    };
    if (gender==="M"){ r.strength = Math.max(0, Math.min(28, r.strength)); }
    else             { r.strength = Math.max(0, Math.min(70, r.strength)); }
    r.run50 = Math.max(6.4, Math.min(13, r.run50));
    r.endur = Math.max(120, Math.min(400, r.endur));
    r.vc    = Math.max(1000, r.vc);
    r.jump  = Math.max(110, r.jump);
    return r;
  }

  function push(gender, nameFn, idxFn){
    const arr = gender==="M" ? NAMES_M : NAMES_F;
    for (let i=0;i<arr.length;i++){
      const name = arr[i];
      const talent = rnd();                       // 运动基础
      const heavy  = rnd();                       // 体型倾向
      const base = gender==="M" ? {
        height: Math.round(166 + rnd()*20),
        weight: Math.round((52 + heavy*32 + (talent-0.5)*7)*10)/10,
        vc:     3000 + talent*1900 + heavy*520,
        run50:  9.2 - talent*2.0 + heavy*0.85,
        reach:  4  + talent*18 - heavy*4.5,
        jump:   176 + talent*72 + (talent>0.78?12:0),
        strength: Math.round(1 + talent*14 + (talent>0.86?4:0)),
        endur:  320 - talent*85 + heavy*38
      } : {
        height: Math.round(154 + rnd()*17),
        weight: Math.round((43 + heavy*23 + (talent-0.5)*5)*10)/10,
        vc:     2000 + talent*1250 + heavy*300,
        run50:  10.6 - talent*2.3 + heavy*0.9,
        reach:  7  + talent*18 - heavy*3.2,
        jump:   132 + talent*62 + (talent>0.78?10:0),
        strength: Math.round(13 + talent*36 + (talent>0.86?7:0)),
        endur:  305 - talent*80 + heavy*34
      };
      const id = (gender==="M" ? "25" : "26") + String(101 + i).padStart(3,"0");
      const recs = {};
      TERMS.forEach((t,ti)=>{ recs[t.id] = makeRecord(gender, base, ti); });
      list.push({
        id, name, gender,
        cls: "高一(10)班",
        avatarColor: ["#3b82f6","#0891b2","#7c3aed","#db2777","#ea580c","#16a34a"][Math.floor(rnd()*6)],
        recs
      });
    }
  }
  push("M");
  push("F");
  return list;
}

const SCORECACHE = {};
function getScore(stu, termId){
  const k = stu.id + "@" + termId;
  if (!SCORECACHE[k]) SCORECACHE[k] = scoreOne(stu.gender, stu.recs[termId]);
  return SCORECACHE[k];
}
function invalidateCache(stuId, termId){
  Object.keys(SCORECACHE).forEach(k=>{
    if (k.indexOf(stuId+"@")===0) delete SCORECACHE[k];
  });
}

function fmtTime(sec){
  if (sec===null||sec===undefined||isNaN(sec)) return "—";
  const m = Math.floor(sec/60), s = Math.round(sec%60);
  return m + "'" + String(s).padStart(2,"0") + '"';
}
function levelTag(lv){
  const m = {"优秀":"t-g","良好":"t-b","及格":"t-a","不及格":"t-r"};
  return '<span class="tag '+(m[lv]||"t-n")+'">'+lv+'</span>';
}
function scoreColor(sc){
  if (sc>=90) return "#15803d"; if (sc>=80) return "#2563eb";
  if (sc>=60) return "#b45309"; return "#b91c1c";
}

function classStats(termId, genderFilter){
  let arr = STUDENTS.map(s=>({s, sc:getScore(s, termId)}));
  if (genderFilter) arr = arr.filter(o=>o.s.gender===genderFilter);
  const n = arr.length || 1;
  const lv = {优秀:0,良好:0,及格:0,不及格:0};
  let total = 0;
  const partSum = {}; ITEMS.forEach(i=>partSum[i.key]=0);
  arr.forEach(o=>{
    total += o.sc.total;
    lv[o.sc.level] = (lv[o.sc.level]||0)+1;
    ITEMS.forEach(i=>{ partSum[i.key] += (o.sc.parts[i.key] ? o.sc.parts[i.key].score : 0); });
  });
  const partAvg = {}; ITEMS.forEach(i=>partAvg[i.key] = Math.round(partSum[i.key]/n*10)/10);
  return {
    n: arr.length,
    avg: Math.round(total/n*10)/10,
    lv,
    goodRate: Math.round((lv.优秀+lv.良好)/n*1000)/10,
    passRate: Math.round((n-lv.不及格)/n*1000)/10,
    partAvg
  };
}

/**
 * 依据测评结果生成个性化运动处方
 */
function makePrescription(stu, termId){
  const sc = getScore(stu, termId);
  const G = stu.gender;

  // 薄弱项：得分低于 72 分的项目，按得分升序
  const weak = ITEMS.map(it=>{
    const p = sc.parts[it.key];
    return { key: it.key, name: itemName(G, it.key), score: p.score, w: it.w };
  }).filter(x=>typeof x.score === "number" && x.score < 72)
    .sort((a,b)=>a.score-b.score);

  const focus = weak.slice(0,3);
  if (focus.length === 0){
    return { keep:true, items:[], focus:[] };
  }

  const sections = focus.map(f=>{
    let libKey = f.key;
    if (f.key === "bmi"){
      libKey = (sc.bmiGrade === "超重" || sc.bmiGrade === "肥胖") ? "bmi_high"
             : (sc.bmiGrade === "低体重") ? "bmi_low" : "bmi_high";
      if (sc.bmiGrade === "正常") libKey = "vc";
    }
    if (f.key === "strength") libKey = G === "M" ? "pullup" : "situp";
    const lib = RX_LIB[libKey];
    return { key: f.key, name: f.name, score: f.score, lib };
  });

  // 优势项（用于保持性练习）
  const strong = ITEMS.map(it=>({key:it.key,name:itemName(G,it.key),score:sc.parts[it.key].score}))
    .filter(x=>x.score>=85).sort((a,b)=>b.score-a.score).slice(0,2);

  return { keep:false, items:sections, focus, strong, total: sc.total, level: sc.level };
}

/* ---------------- 7. 手写 SVG 图表 ---------------- */
function radar(partAvg, size){
  const S = size||276, cx = S/2, cy = S/2 + 6, R = S/2 - 42;
  const keys = ITEMS.map(i=>i.key);
  const G = "高一";
  let axis = "", grid = "", dots = "", labels = "", pts = [];
  for (let ring=1; ring<=4; ring++){
    const r = R*ring/4; let pts=[];
    keys.forEach((k,i)=>{
      const a = -Math.PI/2 + i*2*Math.PI/keys.length;
      pts.push((cx+r*Math.cos(a)).toFixed(1)+","+(cy+r*Math.sin(a)).toFixed(1));
    });
    grid += '<polygon points="'+pts.join(" ")+'" fill="'+(ring===4?"#fbfdff":"none")+'" stroke="#dfe7f2" stroke-width="1"/>';
  }
  keys.forEach((k,i)=>{
    const a = -Math.PI/2 + i*2*Math.PI/keys.length;
    axis += '<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+R*Math.cos(a)).toFixed(1)+'" y2="'+(cy+R*Math.sin(a)).toFixed(1)+'" stroke="#e3e9f3" stroke-width="1"/>';
    const v = Math.max(0, Math.min(100, partAvg[k]||0));
    const r = R*v/100;
    const px = cx+r*Math.cos(a), py = cy+r*Math.sin(a);
    pts.push(px.toFixed(1)+","+py.toFixed(1));
    dots +=  '<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="3.6" fill="#fff" stroke="#2563eb" stroke-width="2"/>';
    const lx = cx+(R+26)*Math.cos(a), ly = cy+(R+26)*Math.sin(a);
    const label = itemName("M", k).replace("体重指数 BMI","BMI").replace("力量项目","力量");
    let anchor = "middle";
    if (lx > cx+6) anchor="start"; else if (lx < cx-6) anchor="end";
    labels += '<text x="'+lx.toFixed(1)+'" y="'+(ly+4).toFixed(1)+'" font-size="12" fill="#5d6d85" text-anchor="'+anchor+'" font-weight="600">'+label+'</text>';
  });
  const poly = pts.join(" ");
  return '<svg viewBox="0 0 '+S+' '+(S+8)+'" style="width:100%;max-width:'+S+'px;height:auto">'
    + grid + axis
    + '<polygon points="'+poly+'" fill="rgba(37,99,235,.17)" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round"/>'
    + dots + labels
    + '</svg>';
}

function donut(lv, total, size){
  const S = size||196, cx=S/2, cy=S/2, r=S/2-14, sw=24;
  const C = 2*Math.PI*r;
  const map = [["优秀","#15803d"],["良好","#2563eb"],["及格","#f59e0b"],["不及格","#dc2626"]];
  let off = 0, seg = "";
  map.forEach(m=>{
    const c = lv[m[0]]||0; if (!c) return;
    const len = C*c/total;
    seg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+m[1]+'" stroke-width="'+sw+'" '
         + 'stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')"/>';
    off += len;
  });
  const rate = Math.round((lv.优秀+lv.良好)/total*1000)/10;
  return '<svg viewBox="0 0 '+S+' '+S+'" style="width:'+S+'px;height:'+S+'px">'
    + '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#eaf0f9" stroke-width="'+sw+'"/>' + seg
    + '<text x="'+cx+'" y="'+(cy-2)+'" text-anchor="middle" font-size="30" font-weight="800" fill="#16202f">'+rate+'</text>'
    + '<text x="'+cx+'" y="'+(cy+18)+'" text-anchor="middle" font-size="12" fill="#5d6d85">优良率 %</text>'
    + '</svg>';
}

function lineChart(series, labels, w, h){
  const W = w||560, H = h||210;
  const padL = 42, padR = 16, padT = 14, padB = 30;
  const all = [].concat.apply([], series.map(s=>s.data)).filter(v=>typeof v==="number");
  let mn = Math.min.apply(null, all), mx = Math.max.apply(null, all);
  if (mn===mx){ mn = mn-5; mx = mx+5; }
  const pad = (mx-mn)*0.18; mn = mn-pad; mx = mx+pad;
  const n = labels.length;
  const X = i => padL + (W-padL-padR) * (n===1?0.5:i/(n-1));
  const Y = v => padT + (H-padT-padB) * (1 - (v-mn)/(mx-mn));
  let grid = "", ylab = "";
  for (let gi=0; gi<=4; gi++){
    const v = mn + (mx-mn)*gi/4, y = Y(v);
    grid += '<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+'" stroke="#eef2f8" stroke-width="1"/>';
    ylab += '<text x="'+(padL-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-size="10.5" fill="#8b99ad">'+v.toFixed(0)+'</text>';
  }
  let xlab = "", paths = "", dots = "";
  labels.forEach((lb,i)=>{
    xlab += '<text x="'+X(i).toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle" font-size="11.5" fill="#5d6d85" font-weight="600">'+lb+'</text>';
  });
  series.forEach(s=>{
    let d = "";
    s.data.forEach((v,i)=>{ d += (i===0?"M":"L") + X(i).toFixed(1) + " " + Y(v).toFixed(1) + " "; });
    paths += '<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>';
    s.data.forEach((v,i)=>{
      dots += '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="4.2" fill="#fff" stroke="'+s.color+'" stroke-width="2.4"/>';
      dots += '<text x="'+X(i).toFixed(1)+'" y="'+(Y(v)-11).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="700" fill="'+s.color+'">'+v+'</text>';
    });
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+grid+ylab+xlab+paths+dots+'</svg>';
}

function groupBar(g1, g2, labels, w, h){
  const W = w||420, H = h||196;
  const padL = 34, padB = 30, padT = 12;
  const mx = 100, n = labels.length;
  const bw = (W-padL-12)/n;
  let s = "", xlab="";
  for (let gi=0; gi<=4; gi++){
    const y = padT + (H-padT-padB)*(1-gi/4);
    s += '<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-8)+'" y2="'+y.toFixed(1)+'" stroke="#eef2f8"/>';
    s += '<text x="'+(padL-6)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-size="10" fill="#8b99ad">'+(gi*25)+'</text>';
  }
  labels.forEach((lb,i)=>{
    const x0 = padL + i*bw;
    const bh1 = (H-padT-padB)*g1[i]/mx, bh2 = (H-padT-padB)*g2[i]/mx;
    s += '<rect x="'+(x0+bw*0.16).toFixed(1)+'" y="'+(H-padB-bh1).toFixed(1)+'" width="'+(bw*0.3).toFixed(1)+'" height="'+Math.max(1,bh1).toFixed(1)+'" rx="3" fill="#2563eb"/>';
    s += '<rect x="'+(x0+bw*0.52).toFixed(1)+'" y="'+(H-padB-bh2).toFixed(1)+'" width="'+(bw*0.3).toFixed(1)+'" height="'+Math.max(1,bh2).toFixed(1)+'" rx="3" fill="#f59e0b"/>';
    xlab += '<text x="'+(x0+bw/2).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" font-size="10.5" fill="#5d6d85" font-weight="600">'+lb+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+s+xlab+'</svg>';
}

/* ---------------- 8.4 数据存档（本地持久化） ----------------
   改动写入 localStorage，只存「差量」而非整份数据：演示数据由
   buildStudents() 确定性生成，重开页面必然还原，无需整体序列化。
   这样存档体积始终很小（几十条记录），也避免 localStorage 配额风险。
   照片不进存档（体积大且无必要），仅保留在当前会话内存中。        */
var LS_KEY = "fitness_demo_edits_v1";
var Store = {
  ok: false,
  edits: {},
  init(){
    var raw = null;
    try {
      raw = window.localStorage.getItem(LS_KEY);
      this.ok = true;
    } catch(e){ this.ok = false; }
    if (raw){
      try {
        var d = JSON.parse(raw);
        if (d && d.v === 1 && d.edits && typeof d.edits === "object") this.edits = d.edits;
      } catch(e){ this.edits = {}; }
    }
    this.apply();
  },
  apply(){
    var ts = Object.keys(this.edits);
    for (var i=0;i<ts.length;i++){
      var term = ts[i], byId = this.edits[term];
      var sids = Object.keys(byId);
      for (var j=0;j<sids.length;j++){
        var sid = sids[j], s = STUDENTS.find(function(x){ return x.id === sid; });
        if (!s || !s.recs || !s.recs[term]) continue;
        var ks = Object.keys(byId[sid]);
        for (var k=0;k<ks.length;k++) s.recs[term][ks[k]] = byId[sid][ks[k]];
        invalidateCache(sid, term);
      }
    }
  },
  put(term, sid, key, val){
    var v = parseFloat(val);
    if (isNaN(v)) return;
    if (!this.edits[term]) this.edits[term] = {};
    if (!this.edits[term][sid]) this.edits[term][sid] = {};
    this.edits[term][sid][key] = v;
    this.flush();
  },
  flush(){
    if (!this.ok) return false;
    try {
      window.localStorage.setItem(LS_KEY, JSON.stringify({ v:1, edits:this.edits }));
      return true;
    } catch(e){ this.ok = false; return false; }
  },
  count(){
    var n = 0, ts = Object.keys(this.edits);
    for (var i=0;i<ts.length;i++){
      var sids = Object.keys(this.edits[ts[i]]);
      for (var j=0;j<sids.length;j++) n += Object.keys(this.edits[ts[i]][sids[j]]).length;
    }
    return n;
  },
  /* 受影响的学生数（按人计，比按项计更贴近教师的感知） */
  students(){
    var set = {}, ts = Object.keys(this.edits);
    for (var i=0;i<ts.length;i++){
      var sids = Object.keys(this.edits[ts[i]]);
      for (var j=0;j<sids.length;j++) set[sids[j]] = 1;
    }
    return Object.keys(set).length;
  },
  clear(){
    this.edits = {};
    if (this.ok){ try { window.localStorage.removeItem(LS_KEY); } catch(e){} }
  }
};

/* ---------------- 8.4b 训练打卡（本地持久化，与 Store 同构） ----------------
   打卡记录使用独立命名空间、单键 JSON 存储，与 Store 的「差量成绩存档」互不干扰：
   - 重置成绩存档不会清掉打卡；两类数据各自独立、互不影响。
   - 日期用本地时区 YYYY-MM-DD，避免直接用 toISOString() 在跨午夜/夏令时偏一天。 */
var LS_CHECKIN = "fitness_demo_checkin_v1";
var CK_STATUS = { done:"已完成", part:"部分完成", none:"未执行" };
var Checkin = {
  ok:false,
  records:{},
  init(){
    var raw=null;
    try { raw=window.localStorage.getItem(LS_CHECKIN); this.ok=true; } catch(e){ this.ok=false; }
    if (raw){
      try { var d=JSON.parse(raw); if (d&&d.v===1&&d.records&&typeof d.records==="object") this.records=d.records; }
      catch(e){ this.records={}; }
    }
  },
  get(sid,date){ return this.records[date+"_"+sid] || null; },
  put(sid,date,data){
    data.sid=sid; data.date=date;
    this.records[date+"_"+sid]=data;
    this.flush();
  },
  flush(){
    if (!this.ok) return false;
    try { window.localStorage.setItem(LS_CHECKIN, JSON.stringify({v:1,records:this.records})); return true; }
    catch(e){ this.ok=false; return false; }
  },
  /* 返回 [from,to] 闭区间内的全部打卡记录（用于按周筛选） */
  range(from,to){
    var out=[], keys=Object.keys(this.records);
    for (var i=0;i<keys.length;i++){
      var rec=this.records[keys[i]];
      if (rec && rec.date>=from && rec.date<=to) out.push(rec);
    }
    return out;
  }
};
function todayStr(){
  var d=new Date(), m=("0"+(d.getMonth()+1)).slice(-2), a=("0"+d.getDate()).slice(-2);
  return d.getFullYear()+"-"+m+"-"+a;
}
function nowStr(){
  var d=new Date(); function p(x){return ("0"+x).slice(-2);} return p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());
}
/* 返回包含 ref 的周一~周日的本地日期区间 [mon, sun] */
function weekRange(ref){
  var d=new Date(ref+"T00:00:00");
  var dow=(d.getDay()+6)%7; // 周一=0 …… 周日=6
  var mon=new Date(d); mon.setDate(d.getDate()-dow);
  var sun=new Date(mon); sun.setDate(mon.getDate()+6);
  function f(x){ var m=("0"+(x.getMonth()+1)).slice(-2), a=("0"+x.getDate()).slice(-2); return x.getFullYear()+"-"+m+"-"+a; }
  return [f(mon), f(sun)];
}
function escapeHtml(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// —— 通道二：Excel 批量导入 ——
/* ---- 通道二：Excel / CSV 批量导入（真实现） ---- */
const IMP_FIELDS = [
  { key:"height",   name:"身高",    unit:"cm", min:100, max:250,  alias:["身高","height"] },
  { key:"weight",   name:"体重",    unit:"kg", min:20,  max:200,  alias:["体重","weight"] },
  { key:"vc",       name:"肺活量",  unit:"ml", min:500, max:9000, alias:["肺活量","vc"] },
  { key:"run50",    name:"50米跑",  unit:"s",  min:4,   max:20,   alias:["50米","50米跑","run50"] },
  { key:"reach",    name:"体前屈",  unit:"cm", min:-30, max:40,   alias:["体前屈","坐位体前屈","reach"] },
  { key:"jump",     name:"立定跳远",unit:"cm", min:50,  max:350,  alias:["跳远","立定跳远","jump"] },
  { key:"strength", name:"力量",    unit:"个", min:0,   max:100,  alias:["力量","引体向上","仰卧起坐","strength"] },
  { key:"endur",    name:"耐力跑",  unit:"s",  min:60,  max:900,  alias:["耐力","耐力跑","1000米","800米","endur"] }
];

function parseCSV(text){
  text = String(text || "").replace(/^\uFEFF/, "");
  const lines = text.split(/\r?\n/).filter(l => l.replace(/[,\t]/g, "").trim() !== "");
  const rows = [];
  for (let n = 0; n < lines.length; n++){
    const line = lines[n];
    const out = []; let cur = "", inQ = false;
    for (let i = 0; i < line.length; i++){
      const ch = line[i];
      if (ch === '"'){
        if (inQ && line[i+1] === '"'){ cur += '"'; i++; } else inQ = !inQ;
      } else if ((ch === "," || ch === "\t") && !inQ){ out.push(cur); cur = ""; }
      else cur += ch;
    }
    out.push(cur);
    rows.push(out.map(s => String(s).trim()));
  }
  return rows;
}

function mapDefault(){
  const fmap = {};
  IMP_FIELDS.forEach((f, i) => { fmap[f.key] = i + 2; });   // 0 学号 1 姓名
  return { idCol: 0, nameCol: 1, fmap: fmap, byName: false };
}

function mapColumns(header){
  const h = (header || []).map(s => String(s || "").trim().toLowerCase());
  let idCol = -1, nameCol = -1;
  for (let i = 0; i < h.length; i++){
    if (idCol < 0 && /学号|学籍号|考号|编号/.test(h[i])) idCol = i;
    if (nameCol < 0 && /姓名|名字|学生/.test(h[i])) nameCol = i;
  }
  if (idCol < 0) idCol = 0;
  if (nameCol < 0) nameCol = 1;
  const fmap = {};
  let hit = 0;
  IMP_FIELDS.forEach(f => {
    let idx = -1;
    for (let i = 0; i < h.length; i++){
      for (let a = 0; a < f.alias.length; a++){
        if (h[i].indexOf(String(f.alias[a]).toLowerCase()) >= 0){ idx = i; break; }
      }
      if (idx >= 0) break;
    }
    fmap[f.key] = idx;
    if (idx >= 0) hit++;
  });
  return (hit < 4) ? mapDefault() : { idCol: idCol, nameCol: nameCol, fmap: fmap, byName: true };
}

function buildImport(rows){
  if (!rows || !rows.length) return { rows: [], err: "文件里没有读到内容。" };
  const joined = (rows[0] || []).join("|");
  const hasHeader = /学号|姓名|身高|name|height/i.test(joined);
  const mm = hasHeader ? mapColumns(rows[0]) : mapDefault();
  const start = hasHeader ? 1 : 0;
  const out = [];
  for (let i = start; i < rows.length; i++){
    const r = rows[i];
    if (!r || !r.length) continue;
    const sid = String(r[mm.idCol] || "").trim();
    const nm  = String(r[mm.nameCol] || "").trim();
    if (!sid && !nm){ continue; }
    const stu = STUDENTS.find(s => (sid && s.id === sid) || (!sid && false)) ||
                STUDENTS.find(s => (nm && s.name === nm)) || null;
    const rec = {}, errs = [];
    IMP_FIELDS.forEach(f => {
      const ci = mm.fmap[f.key];
      const raw = (ci >= 0 && ci < r.length) ? String(r[ci]).trim() : "";
      if (raw === ""){ errs.push(f.name + "缺失"); rec[f.key] = null; return; }
      const v = parseFloat(raw);
      if (isNaN(v)){ errs.push(f.name + "不是数字"); rec[f.key] = null; return; }
      if (v < f.min || v > f.max){ errs.push(f.name + "超出合理范围（" + f.min + "–" + f.max + f.unit + "）"); rec[f.key] = v; return; }
      rec[f.key] = v;
    });
    if (!stu) errs.push("未找到该学生（学号或姓名对不上）");
    out.push({ line: i + 1, sid: sid, name: nm, stu: stu, rec: rec, errs: errs });
  }
  if (!out.length) return { rows: [], err: "没有解析到有效数据行，请检查文件格式。" };
  return { rows: out, err: null, map: mm, header: hasHeader };
}

function downloadTpl(){
  const head = ["学号","姓名","身高(cm)","体重(kg)","肺活量(ml)","50米(s)","体前屈(cm)","跳远(cm)","力量(个)","耐力(s)"];
  const rows = [head];
  STUDENTS.slice(0, 5).forEach(s => {
    const r = s.recs[STATE.term];
    rows.push([s.id, s.name, r.height, r.weight, r.vc, r.run50, r.reach, r.jump, r.strength, r.endur]);
  });
  const csv = "\uFEFF" + rows.map(r => r.join(",")).join("\r\n");
  try{
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "体测成绩导入模板.csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1200);
  }catch(e){
    STATE.importErr = "模板下载失败：" + (e && e.message ? e.message : e);
    UI.go("capture");
  }
}

/* xlsx：尝试用浏览器原生解压读取，不支持时给出明确提示 */
async function readXlsx(file){
  if (typeof DecompressionStream === "undefined")
    throw new Error("当前浏览器不支持直接读取 .xlsx。请在 Excel 中「文件 → 另存为 → CSV UTF-8」后重新选择。");
  const u8 = new Uint8Array(await file.arrayBuffer());
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let eocd = -1;
  for (let i = u8.length - 22; i >= 0 && i > u8.length - 66000; i--){
    if (u8[i] === 0x50 && u8[i+1] === 0x4b && u8[i+2] === 0x05 && u8[i+3] === 0x06){ eocd = i; break; }
  }
  if (eocd < 0) throw new Error("不是有效的 .xlsx 文件，请改用 CSV。");
  const cnt = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const entries = {};
  for (let i = 0; i < cnt; i++){
    if (dv.getUint32(off, true) !== 0x02014b50) break;
    const csize = dv.getUint32(off + 20, true);
    const nlen  = dv.getUint16(off + 28, true);
    const elen  = dv.getUint16(off + 30, true);
    const clen  = dv.getUint16(off + 32, true);
    const lho   = dv.getUint32(off + 42, true);
    const name  = new TextDecoder().decode(u8.subarray(off + 46, off + 46 + nlen));
    const lnlen = dv.getUint16(lho + 26, true);
    const lelen = dv.getUint16(lho + 28, true);
    const ds    = lho + 30 + lnlen + lelen;
    entries[name] = u8.subarray(ds, ds + csize);
    off += 46 + nlen + elen + clen;
  }
  async function inflate(part){
    const s = new Blob([part]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return await new Response(s).text();
  }
  let shared = [];
  if (entries["xl/sharedStrings.xml"]){
    const sx = await inflate(entries["xl/sharedStrings.xml"]);
    const sd = new DOMParser().parseFromString(sx, "text/xml");
    const sis = sd.getElementsByTagName("si");
    for (let i = 0; i < sis.length; i++) shared.push(sis[i].textContent || "");
  }
  const key = entries["xl/worksheets/sheet1.xml"] ? "xl/worksheets/sheet1.xml"
            : Object.keys(entries).filter(k => /worksheets\/sheet1\.xml$/.test(k))[0];
  if (!key) throw new Error("未找到工作表，请改用 CSV。");
  const xml = await inflate(entries[key]);
  const doc = new DOMParser().parseFromString(xml, "text/xml");
  const rs = doc.getElementsByTagName("row");
  const rows = [];
  for (let i = 0; i < rs.length; i++){
    const cells = rs[i].getElementsByTagName("c");
    const arr = [];
    for (let j = 0; j < cells.length; j++){
      const c = cells[j];
      const ref = c.getAttribute("r") || "";
      let ci = 0, cc = ref.replace(/[^A-Z]/g, "");
      for (let k = 0; k < cc.length; k++) ci = ci * 26 + (cc.charCodeAt(k) - 64);
      ci = Math.max(0, ci - 1);
      const t = c.getAttribute("t");
      let v = "";
      const vEl = c.getElementsByTagName("v")[0];
      if (vEl) v = vEl.textContent || "";
      if (t === "s") v = shared[parseInt(v, 10)] || "";
      while (arr.length < ci) arr.push("");
      arr[ci] = v;
    }
    rows.push(arr);
  }
  return rows;
}

function onImpFile(input){
  const f = input && input.files && input.files[0];
  if (!f) return;
  STATE.importErr = "";
  const isXlsx = /\.xlsx$/i.test(f.name || "");
  const finish = function(rows){
    try{
      const im = buildImport(rows);
      if (im.err){ STATE.imp = null; STATE.importErr = im.err; }
      else { STATE.imp = im; STATE.importErr = ""; }
    }catch(e){ STATE.imp = null; STATE.importErr = "解析失败：" + (e && e.message ? e.message : e); }
    UI.go("capture");
  };
  if (isXlsx){
    readXlsx(f).then(finish).catch(function(e){
      STATE.imp = null;
      STATE.importErr = (e && e.message) ? e.message : ("读取 .xlsx 失败：" + e);
      UI.go("capture");
    });
    return;
  }
  const rd = new FileReader();
  rd.onload = function(){
    finish(parseCSV(String(rd.result || "")));
  };
  rd.onerror = function(){ STATE.importErr = "文件读取失败，请重试。"; UI.go("capture"); };
  rd.readAsText(f, "UTF-8");
}

function applyImport(){
  const im = STATE.imp;
  if (!im || !im.rows) return;
  let n = 0;
  im.rows.forEach(r => {
    if (!r.stu || r.errs.length) return;
    const t = STATE.term;
    r.stu.recs[t] = Object.assign({}, r.stu.recs[t], r.rec);
    invalidateCache(r.stu.id, t);
    Object.keys(r.rec).forEach(function(k){ Store.put(t, r.stu.id, k, r.rec[k]); });
    n++;
  });
  STATE.importResult = { ok: n, skip: im.rows.length - n, byName: !!(im.map && im.map.byName) };
  STATE.imp = null;
  UI.go("capture");
}
function cancelImport(){ STATE.imp = null; STATE.importErr = ""; UI.go("capture"); }

/* 分享地址：仅在经本地服务(http/https)打开时才有意义；file:// 直接打开无法被他人扫码访问 */
function shareUrl(){
  try { if (location.protocol === "http:" || location.protocol === "https:") return location.origin + location.pathname; } catch(e){}
  return "";
}
/* 访客入口地址：优先用服务器注入的本机局域网地址（window.__LAN_BASE__），
   这样无论大屏用 127.0.0.1 还是 localhost 打开，扫码出来的都是手机能连上的地址；
   未注入时回退到当前页地址。路径统一用根路径 /?guest=1，避免出现中文文件名导致部分扫码器/微信打不开。 */
function guestUrl(){
  try { if (window.__LAN_BASE__) return window.__LAN_BASE__ + "/?guest=1"; } catch (e) {}
  var base = shareUrl();
  if (!base) return "";
  return base + (base.indexOf("?") >= 0 ? "&" : "?") + "guest=1";
}
/* 生成二维码 SVG（默认纠错 M，自动选最小版本） */
function qrSvg(text, px, border){
  border = border || 4;
  var q = QR.encode(String(text), "M");
  var m = q.matrix, N = m.length, dim = N + border * 2, d = [];
  for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) if (m[r][c]) d.push("M" + (c + border) + " " + (r + border) + "h1v1h-1z");
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + dim + " " + dim + '" width="' + px + '" height="' + px + '" shape-rendering="crispEdges"><rect width="' + dim + '" height="' + dim + '" fill="#ffffff"/><path d="' + d.join("") + '" fill="#0f172a"/></svg>';
}
function escapeHtml(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; }); }

/* 大屏轮询手机上传 */
function startFeed(){
  if (STATE.feedTimer) { clearInterval(STATE.feedTimer); STATE.feedTimer = null; }
  STATE.feedAfter = 0;
  pollFeed();
  STATE.feedTimer = setInterval(pollFeed, 2500);
}
function pollFeed(){
  if (!STATE.served) return;
  fetch("/api/feed?after=" + STATE.feedAfter)
    .then(function (r) { return r.json(); })
    .then(function (arr) {
      if (!arr || !arr.length) return;
      for (var i = 0; i < arr.length; i++) if (arr[i].ts > STATE.feedAfter) STATE.feedAfter = arr[i].ts;
      var wall = document.getElementById("feedWall");
      if (!wall) return;
      var html = arr.map(function (it) {
        return '<div class="feed-item"><img src="' + it.img + '" alt="上传"><div class="feed-meta">' + (it.name ? escapeHtml(it.name) : "手机上传") + '<span>' + fmtTime(it.ts) + '</span></div></div>';
      }).join("");
      wall.insertAdjacentHTML("afterbegin", html);
    })
    .catch(function () {});
}

var CAM = null;

function supportsSpeech(){
  try { return !!(window.speechSynthesis && window.SpeechSynthesisUtterance); } catch(e){ return false; }
}
function pickVoice(){
  try {
    var vs = window.speechSynthesis.getVoices() || [];
    for (var i=0;i<vs.length;i++) if (/^zh/i.test(vs[i].lang)) return vs[i];
    for (var j=0;j<vs.length;j++) if (/CN|Chinese|中文/i.test((vs[j].lang||"") + " " + (vs[j].name||""))) return vs[j];
  } catch(e){}
  return null;
}
/* 口语数字：整数不带小数尾巴——朗读“15.0 厘米”听着像机器，人说的是“15 厘米” */
function vnum(v, d){
  var n = Number(v);
  if (isNaN(n)) return null;
  var s = n.toFixed(d === undefined ? 1 : d);
  return /\.0+$/.test(s) ? s.replace(/\.0+$/, "") : s;
}
function voiceUnit(key, v){
  if (v === null || v === undefined || v === "" || isNaN(v)) return "缺测";
  v = Number(v);
  switch (key){
    case "height":   return vnum(v) + " 厘米";
    case "weight":   return vnum(v) + " 公斤";
    case "vc":       return Math.round(v) + " 毫升";
    case "run50":    return vnum(v) + " 秒";
    case "reach":    return (v < 0 ? "负 " + vnum(Math.abs(v)) : vnum(v)) + " 厘米";
    case "jump":     return Math.round(v) + " 厘米";
    case "strength": return Math.round(v) + " 个";
    case "endur": {
      var m = Math.floor(v / 60), sec = Math.round(v % 60);
      if (sec >= 60){ m += 1; sec = 0; }
      return m + "分" + sec + "秒";
    }
    default:         return String(v);
  }
}
function voiceTarget(){
  var id = STATE.voiceStu || STATE.stuId;
  var list = (typeof visibleStudents === "function") ? visibleStudents() : STUDENTS;
  if (STATE.voiceStu){
    var hit = STUDENTS.find(function(s){ return s.id === id; });
    if (hit) return hit;
  }
  return list.find(function(s){ return s.id === id; }) || list[0] || STUDENTS[0];
}
function voiceLines(stu){
  var t = STATE.term, lines = [];
  lines.push({ k:"head", t: stu.name + "，以下是本次体质测试的录入成绩，请逐项核对。" });
  ITEMS.forEach(function(it){
    if (it.key === "bmi") return;
    var v = stu.recs[t][it.key];
    lines.push({ k:"item", t: itemName(stu.gender, it.key) + "，" + voiceUnit(it.key, v) });
  });
  var sc = getScore(stu, t);
  lines.push({ k:"end", t: "核对完毕。总分 " + sc.total.toFixed(1) + " 分，等级 " + sc.level + "。如与纸质记录不符，请当场更正。" });
  return lines;
}
function voiceHighlight(idx){
  try {
    var els = document.querySelectorAll(".vline");
    for (var i=0;i<els.length;i++){
      var on = (i === idx);
      if (els[i].style){
        els[i].style.background  = on ? "#e8f0ff" : "transparent";
        els[i].style.color       = on ? "#1d4ed8" : "";
        els[i].style.fontWeight  = on ? "600" : "";
      }
    }
  } catch(e){}
}
function speakSeq(lines, i){
  if (i >= lines.length){
    STATE.voiceOn = false;
    STATE.voiceMsg = "朗读完毕，共 " + lines.length + " 条。请确认识别结果与纸质记录一致。";
    UI.go("capture");
    return;
  }
  STATE.voiceIdx = i;
  voiceHighlight(i);
  var u;
  try { u = new window.SpeechSynthesisUtterance(lines[i].t); }
  catch(e){ STATE.voiceOn=false; STATE.voiceMsg="此浏览器无法创建语音对象，朗读不可用。"; UI.go("capture"); return; }
  var v = pickVoice();
  if (v) u.voice = v;
  u.lang = "zh-CN"; u.rate = 0.92; u.pitch = 1; u.volume = 1;
  u.onend = function(){ speakSeq(lines, i+1); };
  u.onerror = function(){
    STATE.voiceOn = false;
    STATE.voiceMsg = "朗读中断，或此设备没有可用的中文语音包。可在系统「语音设置」中安装中文语音后重试。";
    UI.go("capture");
  };
  try { window.speechSynthesis.cancel(); window.speechSynthesis.speak(u); }
  catch(e){ STATE.voiceOn=false; STATE.voiceMsg="语音合成调用失败。"; UI.go("capture"); }
}

function renderScore(){
  const term = TERMS.find(t=>t.id===STATE.term);
  const G = STATE.genderFilter;
  let arr = visibleStudents().filter(s=>!G || s.gender===G);
  const st = classStats(STATE.term, G);

  let rows = arr.map(s=>{
    const sc = getScore(s, STATE.term);
    const r = s.recs[STATE.term];
    return '<tr onclick="UI.pick(\''+s.id+'\')" style="cursor:pointer">'
      + '<td><b>'+s.name+'</b><div style="font-size:11.5px;color:#8b99ad">'+s.id+'</div></td>'
      + '<td>'+(s.gender==="M"?'<span class="tag t-b">男</span>':'<span class="tag" style="background:#fce7f3;color:#be185d">女</span>')+'</td>'
      + '<td class="num">'+r.height+'<div style="font-size:11px;color:#8b99ad">'+r.weight+' kg</div></td>'
      + '<td class="num">'+sc.bmi+'<div style="font-size:11px;color:#8b99ad">'+sc.bmiGrade+'</div></td>'
      + '<td class="num">'+r.vc+'</td>'
      + '<td class="num">'+r.run50.toFixed(1)+'</td>'
      + '<td class="num">'+r.reach.toFixed(1)+'</td>'
      + '<td class="num">'+r.jump+'</td>'
      + '<td class="num">'+r.strength+'</td>'
      + '<td class="num">'+fmtTime(r.endur)+'</td>'
      + '<td class="num" style="text-align:right;font-size:17px;font-weight:800;color:'+scoreColor(sc.total)+'">'+sc.total+'</td>'
      + '<td style="text-align:right">'+levelTag(sc.level)+'</td>'
      + '</tr>';
  }).join("");

  const stu = STUDENTS.find(s=>s.id===STATE.stuId) || arr[0] || STUDENTS[0];
  const sc = getScore(stu, STATE.term);
  const partRows = ITEMS.map(i=>{
    const p = sc.parts[i.key];
    let raw = p.raw;
    if (i.key==="endur") raw = fmtTime(p.raw);
    if (i.key==="bmi")   raw = sc.bmi + "（"+sc.bmiGrade+"）";
    return '<tr><td>'+itemName(stu.gender,i.key)+'</td>'
      + '<td class="num">'+raw+'</td>'
      + '<td class="num" style="text-align:right"><b style="color:'+scoreColor(p.score)+'">'+p.score+'</b></td>'
      + '<td style="text-align:right;font-size:12.5px;color:#8b99ad">'+i.w+'%</td>'
      + '<td style="width:88px"><div class="bar-out"><div class="bar-in" style="width:'+p.score+'%;background:'+scoreColor(p.score)+'"></div></div></td></tr>';
  }).join("");

  return ''
  + '<div class="note mb16"><b>评分口径</b>：严格按教育部《国家学生体质健康标准（2014 年修订）》高中一年级评分表执行，取 100~10 共 20 个分数档 <b>向下查表</b>；BMI 由身高体重实时计算；总分 = Σ（单项得分 × 权重）。满分 100 分标准分，另有最高 20 分附加分（本演示版未计入）。</div>'
  + '<div class="grid g4 mb16">'
    + '<div class="kpi blue"><div class="kpi-l">测算人数</div><div class="kpi-v b">'+st.n+'</div><div class="kpi-s">按当前筛选统计</div></div>'
    + '<div class="kpi cyan"><div class="kpi-l">平均分</div><div class="kpi-v c">'+st.avg+'</div><div class="kpi-s">'+term.name+'</div></div>'
    + '<div class="kpi green"><div class="kpi-l">优良率</div><div class="kpi-v g">'+st.goodRate+'<span class="kpi-u">%</span></div><div class="kpi-s">80 分及以上</div></div>'

    + '</div>'
  + '</div>';
}

/* 处方页追问：带学生上下文的确定性应答 */
function answerRx(q, stu){
  q = String(q||"").trim();
  if (!q) return "请输入你想问的内容。";
  if (!stu) return "请先选择一名学生。";
  const sc = getScore(stu, STATE.term);
  const rx = makePrescription(stu, STATE.term);
  const G  = stu.gender;

  /* 1) 问到具体项目 —— 优先用该项目的处方模块回答 */
  for (const it of ITEMS){
    const nm = itemName(G, it.key);
    if (q.indexOf(nm) >= 0 || (q.indexOf(it.name) >= 0 && it.name.length >= 3)){
      const sec = (rx.items||[]).find(x=>x.key === it.key);
      const own = sc.parts[it.key];
      let s = "【" + nm + "】" + stu.name + " 本次得 " + own.score + " 分";
      if (sec && sec.lib){
        s += "\n\n" + sec.lib.title;
        s += "\n" + sec.lib.items.map(x=>"· " + x.t + "：" + x.d).join("\n");
        if (sec.lib.tip) s += "\n\n提示：" + sec.lib.tip;
      } else {
        s += "\n\n这一项不是当前的薄弱项（已达 " + own.score + " 分），保持现有练习节奏即可，不必额外加量。";
      }
      return s;
    }
  }

  /* 2) 问处方本身 —— 解释这份处方怎么来的 */
  if (/(为什么|依据|怎么来|凭什么|原理|怎么定|如何生成|这份处方)/.test(q)){
    if (rx.keep){
      return stu.name + " 本次各项目均在 72 分以上，系统判定<b>无需针对性补弱处方</b>。\n\n"
        + "判定规则很简单：先按国标算出七个项目的单项得分，凡低于 72 分的进入补弱清单（最多取 3 项），"
        + "再从运动处方知识库里匹配对应训练模块。没有低于 72 分的项目，就不生成处方——<b>不是所有学生都需要处方</b>。";
    }
    let s = "这份处方是这么来的：\n\n";
    s += "1. 先按《国家学生体质健康标准（2014 年修订）》算出 " + stu.name + " 的七项单项得分；\n";
    s += "2. 找出低于 72 分的薄弱项，共 " + (rx.items||[]).length + " 项："
       + (rx.items||[]).map(x=>x.name + "（" + x.score + " 分）").join("、") + "；\n";
    s += "3. 每个薄弱项从处方知识库匹配一组训练动作，按体育课<b>准备—基本—结束</b>三部分的课时框架组装；\n";
    s += "4. 负荷、组次、频次写清楚，教师审定后签发。\n\n";
    s += "需要说明的是，第 1–2 步是<b>确定性计算</b>，不需要 AI；AI 参与的是第 3 步的检索与组装，"
       + "而<b>「能不能练、负荷合不合适」由体育教师把关</b>。";
    return s;
  }

  /* 3) 命中本地知识库 */
  for (const k of KB_RX){
    for (const w of k.keys){
      if (q.indexOf(w) >= 0){
        let s = "【" + k.title + "】\n" + k.body.map(x=>"· " + x).join("\n");
        if (!rx.keep && (k.id === "diet" || k.id === "load" || k.id === "cycle")){
          s += "\n\n结合 " + stu.name + " 的情况：当前重点补弱项为 "
             + (rx.items||[]).map(x=>x.name).join("、")
             + "，上面的原则优先服务于这几项。";
        }
        return s;
      }
    }
  }

  /* 4) 兜底 */
  return "这个问题我暂时答不上来。\n\n本顾问是<b>规则匹配 + 本地知识库</b>的确定性应答，只能覆盖已经录入的内容。你可以试着问：\n"
    + "· 某个项目怎么练（例如「引体向上怎么练」）\n"
    + "· 膳食与营养怎么安排\n"
    + "· 体重管理要注意什么\n"
    + "· 训练强度和负荷怎么掌握\n"
    + "· 这份处方是怎么生成的\n"
    + "· 运动后怎么恢复";
}

/* 今日训练打卡卡片：学生可提交；教师/管理员查看时为只读状态 */
function renderCheckin(stu){
  const rx = makePrescription(stu, STATE.term);
  const today = todayStr();
  const rec = Checkin.get(stu.id, today);
  const isStu = isStudent();

  /* 无处方（各项目均 ≥ 72，无需补弱）时，打卡不启用 */

    return ''
      + '<div class="card"><div class="card-h"><span class="dot"></span><h3>今日训练打卡</h3><span class="sub">'+today+'</span></div>'
      + '<div class="note cyan"><b>'+stu.name+'</b> 本次测评各项目均 ≥ 72 分，暂无需针对性补弱练习，打卡功能暂不启用。请继续保持现有锻炼习惯。</div>'
      + '</div>';
  }

  const items = rx.focus.map(f=>
    '<div class="ck-item"><span class="ck-dot" style="background:'+scoreColor(f.score)+'"></span>'
    + '<span class="ck-name">'+f.name+'</span>'
    + '<span class="ck-sc" style="color:'+scoreColor(f.score)+'">'+f.score+' 分</span></div>'
  ).join("");

  /* 已打卡：只读展示，按钮不再出现 */
  if (rec){
    const st = CK_STATUS[rec.status] || rec.status;
    const tagCls = rec.status==="done" ? "t-g" : rec.status==="part" ? "t-a" : "t-r";
    return ''
      + '<div class="card" style="border-color:var(--ok)"><div class="card-h"><span class="dot" style="background:var(--ok)"></span><h3>今日训练打卡</h3><span class="sub">'+today+'</span></div>'
      + items
      + '<div class="ck-done"><span class="ck-badge">'+icon("hand",16)+' 今日已打卡</span>'
      + '<div class="ck-done-row"><b>完成状态：</b><span class="tag '+tagCls+'">'+st+'</span></div>'
      + (rec.note ? '<div class="ck-done-row"><b>备注：</b>'+escapeHtml(rec.note)+'</div>' : '')
      + '<div class="ck-done-row ck-time">提交时间：'+rec.time+'</div></div>'
      + (isStu ? '<div class="note" style="margin-top:12px">每天记录一条；如需修改，请告知体育教师后在教师端更正。</div>' : '')
      + '</div>';
  }

  /* 未打卡 + 学生角色：交互提交 */
  if (isStu){
    return ''
      + '<div class="card"><div class="card-h"><span class="dot"></span><h3>今日训练打卡</h3><span class="sub">'+today+' · 本人</span></div>'
      + '<div class="note cyan">依据你本次测评的薄弱项生成打卡任务，完成后点选对应状态并提交。记录仅保存在本机浏览器。</div>'
      + items
      + '<div class="ck-label">今日完成状态 <span id="ckWarn" style="color:var(--bad);font-weight:700;display:none">· 请先选择状态</span></div>'
      + '<input type="hidden" id="ckSel" value="">'
      + '<div class="ck-btns">'
        + '<button type="button" class="ck-b" data-v="done" onclick="UI.ckPick(this)">已完成</button>'
        + '<button type="button" class="ck-b" data-v="part" onclick="UI.ckPick(this)">部分完成</button>'
        + '<button type="button" class="ck-b" data-v="none" onclick="UI.ckPick(this)">未执行</button>'
      + '</div>'
      + '<input id="ckNote" class="ck-input" type="text" placeholder="补充备注（选填）：完成了哪几项、身体感受等" maxlength="120">'
      + '<div class="row" style="margin-top:6px"><button class="btn pri" onclick="UI.ckSubmit()">'+icon("send",15)+' 提交打卡</button></div>'
      + '</div>';
  }

  /* 未打卡 + 教师/管理员：只读状态提示 */
  return ''
    + '<div class="card"><div class="card-h"><span class="dot"></span><h3>今日训练打卡</h3><span class="sub">'+today+' · '+stu.name+'</span></div>'
    + items
    + '<div class="note amber">该生今日尚未打卡。学生端提交后这里会实时显示其完成状态，便于课堂针对性督促。</div>'
    + '</div>';
}

  return ''
  + '<div class="note purple mb16"><b>这一部分是本作品的 AI 内核</b>：系统先按国标算出各项目得分，自动识别低于 72 分的薄弱项（最多取 3 项），再从<b>运动处方知识库</b>中匹配对应训练模块，按体育课教案结构（准备—基本—结束）组合成一份可执行的一人一策处方。教师负责审定与调整，机器负责检索与排版。</div>'
  + '<div class="grid g12 mb16">'
    + '<div class="card"><div class="card-h"><span class="dot"></span><h3>'+stu.name+' 的个性化运动处方</h3>'
      + '<span class="sub">总分 '+sc.total+' · '+sc.level+'</span></div>'
      + (rx.keep ? '' : '<div class="row wrap mb12" style="gap:7px">'
          + rx.focus.map(f=>'<span class="tag t-r">'+f.name+' '+f.score+' 分</span>').join("")
          + (rx.strong&&rx.strong.length?'<span style="font-size:12px;color:#8b99ad;margin-left:6px">优势保持：</span>':'')
          + (rx.strong?rx.strong.map(s=>'<span class="tag t-g">'+s.name+' '+s.score+'</span>').join(""):'')

    + '<div class="card"><div class="card-h"><span class="dot"></span><h3>选择学生</h3>'
      + '<span class="sub">'+(isStudent() ? '仅本人（学生视图）' : '共 '+visibleStudents().length+' 人')+'（虚构数据）</span></div>'
      + '<div class="seg mb12">'
        + '<button class="seg-b '+(STATE.genderFilter===""?"on":"")+'" onclick="UI.filter(\'\')">全部</button>'
        + '<button class="seg-b '+(STATE.genderFilter==="M"?"on":"")+'" onclick="UI.filter(\'M\')">男生</button>'
        + '<button class="seg-b '+(STATE.genderFilter==="F"?"on":"")+'" onclick="UI.filter(\'F\')">女生</button>'

      + '<div style="max-height:600px;overflow-y:auto;padding-right:4px"><div class="stu-grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">'+cards+'</div></div>'

  + renderCheckin(stu)
  + '<div class="card"><div class="card-h"><span class="dot"></span><h3>处方是怎么被"组合"出来的</h3></div>'
    + '<div class="steps mb12">'

    + '</div>'
