/* 处方页追问：带学生上下文的确定性应答 */
function answerRx(q, stu){
  q = String(q||"").trim();
  if (!q) return "请输入你想问的内容。";
  if (!stu) return "请先选择一名学生。";
  const sc = getScore(stu, STATE.term);
  const rx = makePrescription(stu, STATE.term);
  const G  = stu.gender;

  /* 1) 问到具体项目 —— 优先用该项目的处方模块回答 */
  for (const it of ITEMS){
    const nm = itemName(G, it.key);
    if (q.indexOf(nm) >= 0 || (q.indexOf(it.name) >= 0 && it.name.length >= 3)){
      const sec = (rx.items||[]).find(x=>x.key === it.key);
      const own = sc.parts[it.key];
      let s = "【" + nm + "】" + stu.name + " 本次得 " + own.score + " 分";
      if (sec && sec.lib){
        s += "\n\n" + sec.lib.title;
        s += "\n" + sec.lib.items.map(x=>"· " + x.t + "：" + x.d).join("\n");
        if (sec.lib.tip) s += "\n\n提示：" + sec.lib.tip;
      } else {
        s += "\n\n这一项不是当前的薄弱项（已达 " + own.score + " 分），保持现有练习节奏即可，不必额外加量。";
      }
      return s;
    }
  }

  /* 2) 问处方本身 —— 解释这份处方怎么来的 */
  if (/(为什么|依据|怎么来|凭什么|原理|怎么定|如何生成|这份处方)/.test(q)){
    if (rx.keep){
      return stu.name + " 本次各项目均在 72 分以上，系统判定<b>无需针对性补弱处方</b>。\n\n"
        + "判定规则很简单：先按国标算出七个项目的单项得分，凡低于 72 分的进入补弱清单（最多取 3 项），"
        + "再从运动处方知识库里匹配对应训练模块。没有低于 72 分的项目，就不生成处方——<b>不是所有学生都需要处方</b>。";
    }
    let s = "这份处方是这么来的：\n\n";
    s += "1. 先按《国家学生体质健康标准（2014 年修订）》算出 " + stu.name + " 的七项单项得分；\n";
    s += "2. 找出低于 72 分的薄弱项，共 " + (rx.items||[]).length + " 项："
       + (rx.items||[]).map(x=>x.name + "（" + x.score + " 分）").join("、") + "；\n";
    s += "3. 每个薄弱项从处方知识库匹配一组训练动作，按体育课<b>准备—基本—结束</b>三部分的课时框架组装；\n";
    s += "4. 负荷、组次、频次写清楚，教师审定后签发。\n\n";
    s += "需要说明的是，第 1–2 步是<b>确定性计算</b>，不需要 AI；AI 参与的是第 3 步的检索与组装，"
       + "而<b>「能不能练、负荷合不合适」由体育教师把关</b>。";
    return s;
  }

  /* 3) 命中本地知识库 */
  for (const k of KB_RX){
    for (const w of k.keys){
      if (q.indexOf(w) >= 0){
        let s = "【" + k.title + "】\n" + k.body.map(x=>"· " + x).join("\n");
        if (!rx.keep && (k.id === "diet" || k.id === "load" || k.id === "cycle")){
          s += "\n\n结合 " + stu.name + " 的情况：当前重点补弱项为 "
             + (rx.items||[]).map(x=>x.name).join("、")
             + "，上面的原则优先服务于这几项。";
        }
        return s;
      }
    }
  }

  /* 4) 兜底：检索大规模本地知识库（带出处） */
  var hits = (typeof KB!=="undefined" && KB.ready)
    ? KB.search(q, {limit:10}).filter(function(h){ return h.doc.kind!=="题目" && String(h.doc.body||"").length>40; }).slice(0,3)
    : [];
  if (hits.length){
    var s = "从本地知识库为你找到以下内容：\n";
    var srcs = {};
    hits.forEach(function(h){
      var t="", lines=String(h.doc.body||"").split("\n");
      for (var z=0;z<lines.length;z++){
        var L=lines[z].trim();
        if (/^【(出处|适用|学段|水平|场景)】/.test(L)) continue;
        if (L.length>=25){ t=L; break; }
      }
      if(!t) t=String(h.doc.body||"").replace(/^【[^】]*】/,"").trim();
      if (t.length>220) t=t.slice(0,220)+"…";
      s += "\n· "+t;
      srcs[h.doc.src]=1;
    });
    s += "\n\n【知识出处】"+Object.keys(srcs).join("；");
    return s;
  }
  return "这个问题本地知识库暂时没有直接覆盖。你可以试着问：\n"
    + "· 某个项目怎么练（例如「引体向上怎么练」）\n"
    + "· 膳食与营养怎么安排\n"
    + "· 体重管理要注意什么\n"
    + "· 训练强度和负荷怎么掌握\n"
    + "· 这份处方是怎么生成的\n"

/* 今日训练打卡卡片：学生可提交；教师/管理员查看时为只读状态 */
function renderCheckin(stu){
  const rx = makePrescription(stu, STATE.term);
  const today = todayStr();
  const rec = Checkin.get(stu.id, today);
  const isStu = isStudent();

  /* 无处方（各项目均 ≥ 72，无需补弱）时，打卡不启用 */
  if (rx.keep){
    return ''
      + '<div class="card"><div class="card-h"><span class="dot"></span><h3>今日训练打卡</h3><span class="sub">'+today+'</span></div>'
      + '<div class="note cyan"><b>'+stu.name+'</b> 本次测评各项目均 ≥ 72 分，暂无需针对性补弱练习，打卡功能暂不启用。请继续保持现有锻炼习惯。</div>'
      + '</div>';
  }

  const items = rx.focus.map(f=>
    '<div class="ck-item"><span class="ck-dot" style="background:'+scoreColor(f.score)+'"></span>'
    + '<span class="ck-name">'+f.name+'</span>'
    + '<span class="ck-sc" style="color:'+scoreColor(f.score)+'">'+f.score+' 分</span></div>'
  ).join("");

  /* 已打卡：只读展示，按钮不再出现 */
  if (rec){
    const st = CK_STATUS[rec.status] || rec.status;
    const tagCls = rec.status==="done" ? "t-g" : rec.status==="part" ? "t-a" : "t-r";
    return ''
      + '<div class="card" style="border-color:var(--ok)"><div class="card-h"><span class="dot" style="background:var(--ok)"></span><h3>今日训练打卡</h3><span class="sub">'+today+'</span></div>'
      + items
      + '<div class="ck-done"><span class="ck-badge">'+icon("hand",16)+' 今日已打卡</span>'
      + '<div class="ck-done-row"><b>完成状态：</b><span class="tag '+tagCls+'">'+st+'</span></div>'
      + (rec.note ? '<div class="ck-done-row"><b>备注：</b>'+escapeHtml(rec.note)+'</div>' : '')
      + '<div class="ck-done-row ck-time">提交时间：'+rec.time+'</div></div>'
      + (isStu ? '<div class="note" style="margin-top:12px">每天记录一条；如需修改，请告知体育教师后在教师端更正。</div>' : '')
      + '</div>';
  }

  /* 未打卡 + 学生角色：交互提交 */
  if (isStu){
    return ''
      + '<div class="card"><div class="card-h"><span class="dot"></span><h3>今日训练打卡</h3><span class="sub">'+today+' · 本人</span></div>'
      + '<div class="note cyan">依据你本次测评的薄弱项生成打卡任务，完成后点选对应状态并提交。记录仅保存在本机浏览器。</div>'
      + items
      + '<div class="ck-label">今日完成状态 <span id="ckWarn" style="color:var(--bad);font-weight:700;display:none">· 请先选择状态</span></div>'
      + '<input type="hidden" id="ckSel" value="">'
      + '<div class="ck-btns">'
        + '<button type="button" class="ck-b" data-v="done" onclick="UI.ckPick(this)">已完成</button>'
        + '<button type="button" class="ck-b" data-v="part" onclick="UI.ckPick(this)">部分完成</button>'
        + '<button type="button" class="ck-b" data-v="none" onclick="UI.ckPick(this)">未执行</button>'
      + '</div>'
      + '<input id="ckNote" class="ck-input" type="text" placeholder="补充备注（选填）：完成了哪几项、身体感受等" maxlength="120">'
      + '<div class="row" style="margin-top:6px"><button class="btn pri" onclick="UI.ckSubmit()">'+icon("send",15)+' 提交打卡</button></div>'
      + '</div>';
  }

  /* 未打卡 + 教师/管理员：只读状态提示 */
  return ''
    + '<div class="card"><div class="card-h"><span class="dot"></span><h3>今日训练打卡</h3><span class="sub">'+today+' · '+stu.name+'</span></div>'
    + items
    + '<div class="note amber">该生今日尚未打卡。学生端提交后这里会实时显示其完成状态，便于课堂针对性督促。</div>'
    + '</div>';
}

function renderRx(){
  const stu = STUDENTS.find(s=>s.id===STATE.stuId) || STUDENTS[0];
  const sc = getScore(stu, STATE.term);
  const rx = makePrescription(stu, STATE.term);
  const logs = rxLogsOf(stu.id);
  const pushed = rxPushedOf(stu.id);
  const isEditing = (STATE.rxDraftFor===stu.id);
  const stage = pushed ? "已推送" : (STATE.rxReviewed ? "已审核" : (isEditing ? "草稿编辑" : "待生成"));

  const cards = visibleStudents().filter(s=>!STATE.genderFilter || s.gender===STATE.genderFilter)
    .map(s=>{
      const c = getScore(s, STATE.term);
      var pv = rxPushedOf(s.id);
      return '<div class="stu-c '+(s.id===STATE.stuId?"on":"")+'" onclick="UI.rxPick(\''+s.id+'\')">'
        + '<div class="stu-nm">'+s.name+'<span style="font-size:11px;color:#8b99ad;font-weight:400">'+(s.gender==="M"?"男":"女")+'</span></div>'
        + '<div class="stu-id">'+s.id+'</div>'
        + '<div class="stu-sc" style="color:'+scoreColor(c.total)+'">'+c.total+'</div>'
        + '<div class="stu-meta">'+(pv?'<span class="tag t-g" style="padding:1px 6px;font-size:10px">已推送 '+rxLogsOf(s.id).length+' 轮</span>':c.level+' · BMI '+c.bmi)+'</div></div>';
    }).join("");

  const flow = '<div class="rx-flow">'
    + [["① 选择学生",true],["② 生成处方",isEditing||!!pushed],["③ 教师编辑",isEditing||!!pushed],["④ 审核签发",STATE.rxReviewed||!!pushed],["⑤ 推送学生",!!pushed]]
      .map(function(x,i){ return '<span class="fs '+((x[1])?(i===4&&pushed?'done':'on'):'')+'">'+x[0]+'</span>'+(i<4?'<span class="fa">›</span>':''); }).join("")
    + '</div>';

  var main = "";
  if (!isEditing && !pushed){
    main = '<div class="card"><div class="card-h"><span class="dot"></span><h3>'+stu.name+' · 体测概览</h3>'
      + '<span class="sub">总分 '+sc.total+' · '+sc.level+' · '+TERMS.find(function(t){return t.id===STATE.term;}).name+'</span></div>'
      + '<div class="grid g4 mb16">'
        + ITEMS.map(function(it){ var p=sc.parts[it.key]; return '<div class="kpi"><div class="kpi-l">'+itemName(stu.gender,it.key)+'</div>'
            + '<div class="kpi-v" style="font-size:23px;color:'+scoreColor(p.score)+'">'+p.score+'</div>'
            + '<div class="kpi-s">'+(p.score<72?'<span class="tag t-r" style="padding:1px 6px;font-size:10px">薄弱</span>':'达标')+'</div></div>'; }).join("")
      + '</div>'
      + '<div class="row"><button class="btn pri" onclick="UI.rxGenerate(\''+stu.id+'\')">'+icon("bulb",15)+' 依据该生生成 AI 处方初稿</button>'
      + '<span class="hint">生成后可逐字编辑，教师审核通过才可推送</span></div></div>';
  } else {
    var text = isEditing ? STATE.rxDraftText : pushed.plan;
    var ta = '<div class="ar-edit"><div class="ck-label">'+(pushed&&!isEditing?'已推送版本（可修改后重新推送）':'处方正文 · 教师可编辑')+'</div>'
      + '<textarea id="rxText" '+(pushed&&!isEditing?'readonly':'')+'>'+escapeHtml(text||"")+'</textarea></div>';
    main = '<div class="card"><div class="card-h"><span class="dot"></span><h3>'+stu.name+' · 个性化运动处方</h3>'
      + '<span class="sub">第 '+(logs.length||1)+' 轮 · '+stage+'</span></div>'
      + flow
      + '<div class="row wrap" style="gap:8px">'
        + rx.focus.map(function(f){return '<span class="tag t-r">'+f.name+' '+f.score+' 分</span>';}).join("")
      + '</div>'
      + ta
      + '<div class="row wrap mt12" style="gap:8px">'
        + ((!pushed||isEditing) ? '<button class="btn" onclick="UI.rxSaveDraft()">保存修改</button>' : '')
        + ((!pushed||isEditing) && !STATE.rxReviewed ? '<button class="btn pri" onclick="UI.rxReview()">'+icon("check",15)+' 教师审核通过</button>' : '')
        + ((STATE.rxReviewed||pushed) ? '<button class="btn pri" onclick="UI.rxPush(\''+stu.id+'\')">'+icon("send",15)+' '+(pushed?'更正并重新推送':'推送到学生端')+'</button>' : '')
        + (pushed && !isEditing ? '<button class="btn" onclick="UI.rxReedit(\''+stu.id+'\')">重新编辑</button>' : '')
      + '</div>'
      + (pushed ? '<div class="rx-pushed mt12"><span class="ic">'+icon("hand",16)+'</span>已推送 · '+fmtStamp(pushed.pushTs)+' · '+escapeHtml(pushed.editor||"体育老师")+'</div>' : '')
      + '</div>';
  }

  var history = logs.length ? '<div class="card"><div class="card-h"><span class="dot"></span><h3>处方历史（逐步闭环）</h3>'
      + '<span class="sub">共 '+logs.length+' 轮</span></div><div class="tl-evidence">'
      + logs.map(function(r,i){
          var st = r.status==="pushed"?'<span class="tag t-g">已推送</span>':'<span class="tag t-a">'+stageName(r.status)+'</span>';
          return '<div class="tl-ev '+(r.status==="pushed"?'ok':'ai')+'"><div class="d">第 '+(i+1)+' 轮 · '+fmtStamp(r.ts)+' · '+TERMS.find(function(t){return t.id===r.term;}).name+' '+st+'</div>'
            + '<div class="t">'+escapeHtml((r.plan||"").split("\n")[0])+(r.editNote?' · '+escapeHtml(r.editNote):'')+'</div></div>';
        }).join("")
      + '</div></div>' : '';

  return ''
  + filterBar()
  + '<div class="grid g12 mb16">'
    + main
    + '<div class="card"><div class="card-h"><span class="dot"></span><h3>选择学生</h3>'
      + '<span class="sub">点击学生查看数据并生成处方</span></div>'
      + '<div style="max-height:600px;overflow-y:auto;padding-right:4px"><div class="stu-grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">'+cards+'</div></div>'
    + '</div>'
  + '</div>'
  + history
  + renderCheckin(stu);
}
function stageName(st){ return st==="pushed"?"已推送":st==="reviewed"?"已审核":st==="edited"?"已编辑":"草稿"; }
/* ================= 学生端板块（体质健康垂直闭环） ================= */
function myStu(){ return selfStudent(); }
function myScore(){ return getScore(myStu(), STATE.term); }
function weakItems(stu, sc){
  var out=[];
  ITEMS.forEach(function(it){
    var p = sc.parts[it.key];
    if (p && p.score < 70) out.push(it);
  });
  return out.length ? out : [ITEMS[2]];
}
function stuHead(title, sub){
  var s=myStu();
  return '<div class="card std-card"><div class="card-h"><span class="dot"></span><h3>'+title+'</h3><span class="sub">'+(sub||("本人 · "+s.name+" · "+TERMS.find(function(t){return t.id===STATE.term;}).name))+'</span></div>';
}

/* 学生端①：我的体质（画像总览） */
function renderSHomeBody(skipHead){
  var s=myStu(), sc=myScore(), weak=weakItems(s,sc);
  var parts=ITEMS.map(function(it){ var p=sc.parts[it.key]; return {k:it.key,name:itName(it.key,s.gender),score:p?p.score:0}; });
  var radarObj = {}; parts.forEach(function(p){ radarObj[p.k]=p.score; });
  var radarHtml = radar(radarObj, 200);
  var pending = Engage.list("asks").filter(function(a){return a.sid===s.id && a.status==="done";}).length;
  var detail = ITEMS.map(function(it){

  return (skipHead ? '' : stuHead("我的体质健康画像"))
    + '<div class="grid g2" style="align-items:center"><div>'

    + '<div class="row" style="margin-top:12px;gap:10px;flex-wrap:wrap">'
      + '<div class="kpi" style="flex:1"><div class="kpi-l">薄弱项</div><div class="kpi-v" style="font-size:24px">'+weak.length+'</div></div>'
      + '<div class="kpi" style="flex:1"><div class="kpi-l">待办任务</div><div class="kpi-v" style="font-size:24px">'+(weak.length+Engage.list("tasks").filter(function(t){return t.group==="全体学生";}).length)+'</div></div>'
      + '<div class="kpi" style="flex:1"><div class="kpi-l">老师回复</div><div class="kpi-v" style="font-size:24px">'+pending+'</div></div>'
    + '</div></div>'
    + '<div style="text-align:center">'+radarHtml+'<div class="sub" style="margin-top:8px">各项体质得分雷达</div></div></div>'
    + '<div style="margin-top:24px;padding-top:20px;border-top:1px solid var(--line)">'
      + '<div class="card-h" style="margin-bottom:16px"><h3 style="font-size:15px">各项得分明细</h3><span class="sub">满分 100 · 依国标评分</span></div>'
      + '<div class="grid g2" style="gap:6px 40px">'+detail+'</div>'
    + '</div>'
    + '<div class="row" style="margin-top:auto;padding-top:18px;gap:8px;flex-wrap:wrap">'
      + '<button class="btn pri" onclick="UI.go(\'s_report\')">查看体测报告</button>'
      + '<button class="btn" onclick="UI.go(\'s_rx\')">我的运动处方</button>'
      + '<button class="btn" onclick="UI.go(\'s_ask\')">我有问题要问</button>'
    + '</div>'+(skipHead ? '' : '</div>');
}
function itName(key, gender){
  var it = ITEMS.find(function(x){return x.key===key;});
  if (!it) return key;
  if (key==="strength") return gender==="M"?"引体向上":"仰卧起坐";
  if (key==="endur") return gender==="M"?"1000 米跑":"800 米跑";
  return it.name;
}

/* 学生端②：我的任务 */
function renderSTask(){
  var s=myStu(), sc=myScore(), weak=weakItems(s,sc);
  var tasks = weak.map(function(w,i){
    return { name:itName(w.key,s.gender)+" 专项提升", dose:(i===0?"每周 3 次 · 4 周":"每周 2 次 · 4 周"), status:i%2===0?"待完成":"进行中", from:"AI 处方" };
  });
  // 合并教师端推送的任务：全体学生，或与本人薄弱项匹配的小组
  var weakGroupMap = { run50:"短跑薄弱组", endur:"耐力薄弱组", reach:"柔韧薄弱组" };
  var myGroups = weak.map(function(w){ return weakGroupMap[w.key]; }).filter(Boolean);
  var pushed = Engage.list("tasks").filter(function(t){
    return t.group==="全体学生" || myGroups.indexOf(t.group)>=0;
  });
  pushed.forEach(function(t){ tasks.unshift({ name:t.title, dose:t.type+" · "+t.group, status:"新推送", from:"体育老师" }); });
  tasks.push({name:"本学期体质复测",dose:"期末随堂安排",status:"待安排",from:"系统"});
  var rows = tasks.map(function(t,i){
    var cls = t.status==="待完成"?"t-a":(t.status==="进行中"?"t-g":(t.status==="新推送"?"t-b":"t-n"));
    var pct = t.status==="进行中"?60:(t.status==="待完成"?0:(t.status==="新推送"?10:0));
    var pcolor = t.status==="进行中"?"#2563eb":(t.status==="待完成"?"#f59e0b":"#94a3b8");
    return '<div style="border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:14px;background:#fff">'
      + '<div style="display:flex;align-items:center;gap:12px">'
        + '<div style="width:44px;height:44px;border-radius:12px;background:#eff6ff;color:#2563eb;display:flex;align-items:center;justify-content:center;flex:0 0 44px">'+icon("sheet",20)+'</div>'
        + '<div style="flex:1"><div style="font-size:16px;font-weight:700">'+escapeHtml(t.name)+'</div><div class="sub" style="margin-top:3px">'+escapeHtml(t.dose)+'</div></div>'
        + '<span class="tag '+cls+'">'+t.status+'</span>'
      + '</div>'
      + '<div style="margin-top:14px;display:flex;align-items:center;gap:10px">'
        + '<div style="flex:1;height:6px;background:#eef2f8;border-radius:6px;overflow:hidden"><div style="width:'+pct+'%;height:100%;background:'+pcolor+';border-radius:6px"></div></div>'
        + '<span class="sub" style="white-space:nowrap">'+pct+'%</span>'
      + '</div>'
      + '<div class="sub" style="margin-top:10px">来源：'+t.from+'</div>'
      + '</div>';
  }).join("");
  // 训练课问卷：教师发布后学生可填写
  var surveys = Engage.list("surveys").filter(function(sv){ return sv.target==="全体学生" || sv.target===s.cls; });
  var surveyHtml = "";
  if (surveys.length){
    surveyHtml = '<div class="card mb16"><div class="card-h"><span class="dot"></span><h3>训练课评价问卷</h3><span class="sub">请如实评价本节课</span></div>'
      + surveys.map(function(sv){
          var done = Engage.list("evals").some(function(e){return e.surveyId===sv.id && e.sid===s.id;});
          if (done) return '<div class="ar-ai" style="background:var(--ok-l);border-color:#bbf7d0"><span class="lb" style="color:var(--ok)">已提交</span><div style="font-size:14px">'+escapeHtml(sv.course||"")+'</div></div>';
          var radios = (sv.qs||[]).map(function(q,i){
            return '<div class="ck-label" style="margin-top:8px">'+escapeHtml(q)+'</div>'
              + '<div class="row wrap" style="gap:6px">'+[1,2,3,4,5].map(function(n){
                  return '<label class="ck-b" style="flex:0 0 46px;text-align:center;cursor:pointer" onclick="UI.evalAns('+i+','+n+')"><input type="radio" name="ev_'+sv.id+'_'+i+'" '+(STATE.evalAns&&STATE.evalAns[i]===n?'checked':'')+'> '+n+'</label>';
                }).join("")+'</div>';
          }).join("");
          return '<div class="ar-card"><div class="ar-head"><span class="tag t-c">待填写</span><span class="who" style="font-size:13.5px">'+escapeHtml(sv.course||"训练课")+'</span><span class="ts">'+fmtStamp(sv.ts)+'</span></div>'
            + '<div class="ar-body">'+radios
            + '<div class="ck-label" style="margin-top:8px">一句话建议（可选）</div>'
            + '<input id="evNote_'+sv.id+'" class="mini-in" style="text-align:left" placeholder="如：希望增加个别指导">'
            + '<div class="row mt12"><button class="btn pri" onclick="UI.evalSubmit(\''+sv.id+'\')">提交评价</button></div></div></div>';
        }).join("") + '</div>';
  }
  return stuHead("我的体测任务", "本人 · "+s.name)
    + surveyHtml
    + '<div style="margin-top:6px">'+rows+'</div>';
    + '<div class="row" style="margin-top:auto;padding-top:16px;gap:8px"><button class="btn pri" onclick="UI.go(\'s_rx\')">查看处方详情</button><button class="btn" onclick="UI.go(\'s_track\')">看我的成长曲线</button></div>'
    + '</div>';
}

/* 学生端③：我的体测报告 */
function renderSReportBody(skipHead){
  var s=myStu(), sc=myScore();
  var rows = ITEMS.map(function(it){
    var p=sc.parts[it.key];

/* 题库：优先从本地知识库的"题目"类条目解析，保证题目有出处；失败时用内置兜底题 */
/* 把知识库题目的子类归一到 10 大主类，保证题库分类清晰 */
function quizCatOf(d){
  var t = (d.sub||"");  // 只用子类名匹配，避免"测试题库"大类前缀干扰
  var M = [
    ["测试与国标",["国标","数据诚信","BMI","身体成分","体重管理","测试与国标"]],
    ["心肺耐力",["心肺耐力","肺活量","耐力跑","800米","1000米"]],
    ["速度与爆发力",["速度与爆发力","50米","短跑","速度","起跑"]],
    ["下肢爆发力",["下肢爆发力","立定跳远","跳远","弹跳"]],
    ["肌肉力量与耐力",["肌肉力量与耐力","引体向上","仰卧起坐","力量素质"]],
    ["柔韧素质",["柔韧素质","坐位体前屈","柔韧"]],
    ["营养与膳食",["营养与膳食","膳食","补糖补盐","营养"]],
    ["运动损伤与安全",["运动损伤与安全","损伤处理","热身","安全"]],
    ["健康生活方式",["健康生活方式","睡眠","恢复","心理"]],
    ["运动常识",["运动常识","训练原则","超量恢复","渐进超负荷","常识"]]
  ];
  for (var i=0;i<M.length;i++){
    var kws=M[i][1];
    for (var j=0;j<kws.length;j++){ if (t.indexOf(kws[j])>=0) return M[i][0]; }
  }
  return "运动常识";
}
function quizBank(){
  /* 题库：全部来自本地知识库"题目"类（305+ 分类题），并叠加管理员自建题 */
  var qs=[];
  try {
    var pool = (typeof KB!=="undefined" && KB.ready) ? KB.all().filter(function(d){ return d.kind==="题目"; }) : [];
    pool.forEach(function(d){
      var m=String(d.body||"").match(/题干：([\s\S]*?)\n选项：([\s\S]*?)\n正确答案：([^\n]*)/);
      if (!m) return;
      var opts=m[2].split(" / ").map(function(x){return x.trim();});
      var ai=opts.indexOf(m[3].trim());
      if (ai>=0 && opts.length===4 && m[1].trim()) qs.push({q:m[1].trim(), opts:opts, a:ai, cat:quizCatOf(d), src:d.src||""});
    });
  } catch(e){}
  /* 叠加自建题（可见于所有角色，保证跨会话可用） */
  try {
    var custom = JSON.parse(window.localStorage.getItem("fitness_custom_quiz")||"[]");
    if (Array.isArray(custom)) custom.forEach(function(x){ if (x&&x.q&&x.opts&&x.opts.length===4) qs.push({q:x.q,opts:x.opts,a:x.a,cat:x.cat||"自建题",src:x.src||"教师自建",custom:true,id:x.id}); });
  } catch(e){}
  if (!qs.length){
    qs=[
      {q:"《国家学生体质健康标准》目前执行的是哪一版？",opts:["2002 年","2007 年","2014 年修订","2020 年"],a:2,cat:"测试与国标",src:"教育部"},
      {q:"50 米跑主要反映学生的哪项身体素质？",opts:["柔韧性","速度/爆发力","耐力","力量"],a:1,cat:"速度与爆发力",src:"《运动训练学》"},
      {q:"坐位体前屈主要测量的是？",opts:["下肢柔韧性","上肢力量","心肺耐力","反应速度"],a:0,cat:"柔韧素质",src:"教育部"}
    ];
  }
  return qs;
}

function renderRxEffectBody(skipHead){

  var pushedLogs = logs.filter(function(r){return r.status==="pushed";});
  var scores = TERMS.map(function(t){return getScore(stu,t.id).total;});
  var dFirst = scores[0], dLast = scores[scores.length-1], gain = Math.round((dLast-dFirst)*10)/10;
  var weakKeys = ITEMS.slice().sort(function(a,b){
    return getScore(stu,STATE.term).parts[a.key].score-getScore(stu,STATE.term).parts[b.key].score;
  }).slice(0,3).map(function(x){return x.key;});
  var SER_COLORS = ["#dc2626","#f59e0b","#0891b2"];
  var itemSeries = weakKeys.map(function(k,i){
    return { data:TERMS.map(function(t){return getScore(stu,t.id).parts[k].score;}), color:SER_COLORS[i] };
  });
  var watchLegend = weakKeys.map(function(k,i){
    return '<span><i style="background:'+SER_COLORS[i]+'"></i>'+itemName(stu.gender,k)+'</span>';
  }).join("");
  var all = students.map(function(s){return getScore(s,STATE.term).total-getScore(s,TERMS[0].id).total;});
  var avg = all.length ? Math.round(all.reduce(function(a,b){return a+b;},0)/all.length*10)/10 : 0;

  /* 左：学生清单，点击即联动右侧，不跳顶 */
  var list = students.map(function(s){
    var t1=getScore(s,TERMS[0].id).total, t3=getScore(s,STATE.term).total;
    var d=Math.round((t3-t1)*10)/10, cls=d>=6?"t-g":d>=0?"t-b":"t-r";
    return '<div class="md-item '+(s.id===stu.id?'on':'')+'" onclick="UI.rxEffectPick(\''+s.id+'\')">'
      + '<div class="md-ava">'+escapeHtml(s.name.slice(-2))+'</div>'
      + '<div class="md-meta"><b>'+escapeHtml(s.name)+'</b><small>'+escapeHtml(s.cls)+'</small></div>'
      + '<div class="md-score">'+t3+'<small><span class="tag '+cls+'">'+(d>=0?'+':'')+d+'</span></small></div>'
      + '</div>';
  }).join("");

  /* 五步闭环流程条 */
  var stepDef = [['首次测评',true],['生成处方',true],['教师推送',pushedLogs.length>0],['复测验证',pushedLogs.length>0],['再处方',pushedLogs.length>1]];
  var flow = '<div class="rx-flow">'+stepDef.map(function(s,i){
      return (i?'<span class="fa">→</span>':'')+'<span class="fs '+(s[1]?'done':'')+'">'+(i+1)+'. '+s[0]+'</span>';
    }).join('')+'</div>';

      + '<div class="mk"><div class="l">该生变化</div><div class="v" style="color:'+(gain>=0?'var(--ok)':'var(--bad)')+'">'+(gain>=0?'+':'')+gain+'<span style="font-size:13px"> 分</span></div></div>'
    + '</div>'
    + '<div class="gmd">'
      + '<div class="card"><div class="card-h"><span class="dot"></span><h3>选择学生</h3><span class="sub">点击看闭环</span></div>'
        + '<div class="md-list">'+list+'</div></div>'
      + '<div>'

            + '<div class="mk"><div class="l">首次测评</div><div class="v">'+dFirst+'</div></div>'
            + '<div class="mk"><div class="l">本次测评</div><div class="v">'+dLast+'</div></div>'

            + '<div class="mk"><div class="l">已推送轮次</div><div class="v">'+pushedLogs.length+'</div></div>'
          + '</div>'

    + ((d.tags&&d.tags.length) ? '<div class="kb-tags">'+d.tags.slice(0,5).map(function(t){return '<i>'+escapeHtml(t)+'</i>';}).join("")+'</div>' : '')

function kbSearchUI(){
  if (typeof KB==="undefined" || !KB.ready){
    return '<div class="card" style="text-align:center;padding:40px 20px">'
      + '<div style="font-size:17px;font-weight:700;color:var(--text)">知识库正在后台加载…</div>'
      + '<div class="hint-soft" style="margin-top:8px">首次打开需下载本地知识库（约 70 万字），加载完成后本页会自动刷新，其他功能不受影响。</div>'
      + (STATE && STATE.kbError ? '<div class="hint-soft" style="margin-top:10px;color:var(--bad)">加载失败，请检查 kb_data.js 是否与网页在同一目录后刷新。</div>' : '')
      + '</div>';
  }
  var cats = KB.categories();
  var active = STATE.kbCat||"";
  var q = STATE.kbQuery||"";
  var html = '<div class="kb-search">'
    + '<input id="kbIn" type="text" placeholder="搜索知识：如 立定跳远怎么练 / 膳食 / 热身 / BMI …" value="'+escapeHtml(q)+'" onkeydown="if(event.key===\'Enter\')UI.kbDoSearch()">'
    + '<button class="btn pri" onclick="UI.kbDoSearch()">'+icon("book",15)+' 检索</button></div>';
  html += '<div class="kb-cat"><span class="'+(active?"":"on")+'" onclick="UI.kbCat(\'\')">全部 · '+KB.meta.count+' 条</span>'
       + cats.map(function(c){ return '<span class="'+(active===c.name?"on":"")+'" onclick="UI.kbCat(\''+c.name.replace(/'/g,"")+'\')">'+escapeHtml(c.name)+' · '+c.count+'</span>'; }).join("")
       + '</div>';
  var list, stat;
  if (q){
    var res = KB.search(q, {limit:40, cat:active||""});
    list = res.map(function(r){return kbDocCard(r.doc);}).join("");
    stat = '检索「<b>'+escapeHtml(q)+'</b>」命中 <b>'+res.length+'</b> 条'+(active?'（分类：'+escapeHtml(active)+'）':'');
  } else if (active){
    var docs = KB.byCat(active, 40);
    list = docs.map(kbDocCard).join("");
    stat = '分类「<b>'+escapeHtml(active)+'</b>」共 <b>'+KB.byCat(active,9999).length+'</b> 条，显示前 '+docs.length+' 条';
  } else {
    var rec = KB.byItem("jump",4).concat(KB.byItem("vc",4));
    list = rec.map(function(r){return kbDocCard(r.doc);}).join("");
    stat = '本地知识库共 <b>'+KB.meta.count+'</b> 条 · <b>'+(KB.meta.chars/10000).toFixed(1)+'</b> 万字 · <b>'+KB.meta.sourceCount+'</b> 类来源。输入关键词或点分类开始检索。';
  }
  html += '<div class="kb-stat">'+stat+'</div>';
  html += list ? list : '<div class="kb-empty">没有找到相关条目，试试其他关键词或切换到"全部"分类。</div>';
  return html;
}

function renderQuizBank(){
  var bank = quizBank();
  var cats = quizCats();
  var cur = STATE.quizCat||"";
  var kw = (STATE.quizKw||"").trim();
  var picked = STATE.bankPick || [];
  var showAns = STATE.bankShowAns || {};
  var canManage = canEdit();   /* 教师/管理员可增删题 */
  /* 按分类 + 关键词过滤（在过滤后的子集内用索引，避免选题错位） */
  var filtered = bank.map(function(q,i){ return {q:q, i:i}; }).filter(function(o){
    var okCat = !cur || (o.q.cat||"综合")===cur;
    var okKw = !kw || (o.q.q+o.q.opts.join("")+(o.q.cat||"")).indexOf(kw)>=0;
    return okCat && okKw;
  });
  var targets = ["全体学生", "高一年级", "耐力薄弱组", "速度薄弱组", "力量薄弱组"];
  var tOpts = targets.map(function(g){return '<option'+(STATE.quizTarget===g?' selected':'')+'>'+g+'</option>';}).join("");
  var cards = filtered.slice(0,60).map(function(o,idx){
    var q=o.q, i=o.i;
    var on = picked.indexOf(i)>=0;
    var opts = q.opts.map(function(op,j){ return '<span>'+String.fromCharCode(65+j)+'. '+escapeHtml(op)+'</span>'; }).join("");
    return '<div class="quiz-card '+(on?'on':'')+'" onclick="UI.bankPick('+i+')" title="点击选中/取消">'
      + '<div class="qc-top"><div class="qc-q">'+(idx+1)+'. '+escapeHtml(q.q)+'</div><span class="qc-no">'+(q.cat||"综合")+'</span></div>'
      + '<div class="qc-opts">'+opts+'</div>'
      + (showAns[i] ? '<div class="qc-ans">正确答案：'+escapeHtml(q.opts[q.a])+(q.src?' · 出处：'+escapeHtml(q.src):'')+'</div>':'')
      + '<div class="qc-foot"><span class="'+(on?'qc-picked':'')+'">'+(on?'✓ 已选中':'点击卡片选中')+'</span>'
      + '<span class="qc-act" onclick="event.stopPropagation();UI.bankShowAns('+i+')">'+(showAns[i]?'隐藏答案':'查看答案')+'</span>'
      + (canManage && q.custom ? '<span class="qc-act del" onclick="event.stopPropagation();UI.bankDel('+i+')">删除</span>' : '')
      + '</div></div>';
  }).join("");
  var catChips = '<span class="quiz-cat '+(cur?"":"on")+'" onclick="UI.bankCat(\'\')">全部 '+bank.length+'</span>'
    + cats.map(function(c){ var n=bank.filter(function(q){return (q.cat||"综合")===c;}).length; return '<span class="quiz-cat '+(cur===c?'on':'')+'" onclick="UI.bankCat(\''+c.replace(/'/g,"")+'\')">'+escapeHtml(c)+' '+n+'</span>'; }).join("");
  var addForm = canManage ? '<div class="card mb16"><div class="card-h"><span class="dot"></span><h3>新增题目</h3><span class="sub">自建题会保存到本机，可删除</span></div>'
      + '<div class="qc-add"><input id="qAddStem" class="mini-in" placeholder="题干，如：立定跳远起跳时应该？">'
      + '<div class="qc-add-opts">'
      + '<input id="qAddA" class="mini-in" placeholder="选项A"><input id="qAddB" class="mini-in" placeholder="选项B">'
      + '<input id="qAddC" class="mini-in" placeholder="选项C"><input id="qAddD" class="mini-in" placeholder="选项D"></div>'
      + '<div class="row wrap" style="gap:8px;align-items:center">'
      + '<select id="qAddAns" class="mini-in" style="width:auto"><option value="0">正确答案 A</option><option value="1">正确答案 B</option><option value="2">正确答案 C</option><option value="3">正确答案 D</option></select>'
      + '<select id="qAddCat" class="mini-in" style="width:auto">'+cats.map(function(c){return '<option>'+escapeHtml(c)+'</option>';}).join("")+'<option>自建题</option></select>'
      + '<input id="qAddSrc" class="mini-in" style="width:auto;flex:1;min-width:160px" placeholder="出处（可选）">'
      + '<button class="btn pri" onclick="UI.bankAdd()">'+icon("plus",15)+' 添加题目</button></div></div></div>' : '';
  return filterBar()
    + tmHead("体测知识小测 · 题库与组卷", "共 "+bank.length+" 题 · "+cats.length+" 类 · 每题可溯源")
    + addForm
    + '<div class="card mb16"><div class="qc-toolbar">'
      + '<div class="quiz-cats">'+catChips+'</div>'
      + '<div class="row" style="gap:8px;align-items:center;flex-wrap:wrap">'
        + '<input id="quizKw" class="mini-in" style="width:180px" placeholder="搜索题干/选项" value="'+escapeHtml(kw)+'" onkeydown="if(event.key===\'Enter\')UI.bankSearch()">'
        + '<button class="btn sm" onclick="UI.bankSearch()">检索</button>'

      + '</div>'
      + '<div class="qc-stat">当前显示 <b>'+filtered.length+'</b> 题'+(filtered.length>60?'（显示前 60 题）':'')+' · 已选 <b>'+picked.length+'</b> 题</div>'
    + '</div></div>'
    + '<div class="quiz-bank-grid">'+cards+'</div>'
    + (filtered.length?'':'<div class="card"><div class="empty">没有匹配的题目，换个分类或关键词试试。</div></div>')
    + '<div class="qc-float"><span>已选 '+picked.length+' 题</span><button class="btn pri" onclick="UI.bankPush()">'+icon("send",15)+' 组卷并下发</button></div>';

function renderEvalReview(){
  var ev = Engage.list("evals");
  var surveys = Engage.list("surveys");
  var cur = surveys.length ? surveys[0] : null;
  var answered = ev.filter(function(e){return e.surveyId===(cur&&cur.id);});
  var avg = ev.length ? Math.round(ev.reduce(function(a,b){return a+(+b.score||0);},0)/ev.length*10)/10 : 0;
  var groups = ["全体学生"].concat(classNamesOf(STATE.gradeFilter||DEFAULT_GRADE));
  var tOpts = groups.map(function(g){return '<option'+(STATE.evalTarget===g?' selected':'')+'>'+g+'</option>';}).join("");

  var step = '<div class="rx-flow">'
    + [["① 填写本节课信息",true],["② AI 生成问卷",!!cur],["③ 学生填写",answered.length>0],["④ 查看反馈再推送",answered.length>0]]
      .map(function(x,i){return '<span class="fs '+((x[1])?(i===3&&answered.length?'done':'on'):'')+'">'+x[0]+'</span>'+(i<3?'<span class="fa">›</span>':'');}).join("")+'</div>';

  var inputCard = '<div class="card mb16"><div class="card-h"><span class="dot"></span><h3>① 本节课信息</h3>'
    + '<span class="sub">输入大致情况，AI 据此生成问卷</span></div>'
    + '<div class="tp-form">'
      + '<div><div class="ck-label">课程主题</div><input id="evCourse" class="mini-in" style="text-align:left" placeholder="如：立定跳远蹬摆协调整合课" value="'+escapeHtml(STATE.evalCourse||"")+'"></div>'
      + '<div><div class="ck-label">推送对象</div><select id="evalTarget" class="mini-in">'+tOpts+'</select></div>'
    + '</div>'
    + '<div class="ck-label" style="margin-top:8px">主要练习内容与强度（一句话）</div>'
    + '<input id="evContent" class="mini-in" style="text-align:left" placeholder="如：深蹲跳 3×12、台阶交换跳 3×10，中等强度，约 40 分钟">'
    + '<div class="row mt12"><button class="btn pri" onclick="UI.evalGenSurvey()">'+icon("bulb",15)+' AI 生成本节课问卷</button></div></div>';

  var surveyCard = '';
  if (cur){
    var qs = (cur.qs||[]).map(function(q,i){
      return '<div class="rx-item"><div class="rx-item-n">'+(i+1)+'</div><div class="rx-item-t"><b>'+escapeHtml(q)+'</b>'
        + '<div class="rx-dose">1 分很差 · 5 分很好</div></div></div>';
    }).join("");
    surveyCard = '<div class="card mb16"><div class="card-h"><span class="dot"></span><h3>② 生成的 AI 问卷</h3>'
      + '<span class="sub">'+escapeHtml(cur.course||"")+' · '+fmtStamp(cur.ts)+'</span></div>'
      + '<div class="rx-sec">'+qs+'</div>'
      + '<div class="row mt12"><span class="tag t-g">已发布到学生端</span>'
      + '<button class="btn sm" onclick="UI.evalRepublish()">重新生成</button></div></div>';
  } else {
    surveyCard = '<div class="card mb16"><div class="empty">尚未生成本节课问卷。先在上方填写课程信息，再点「AI 生成本节课问卷」。</div></div>';
  }

  var feedbackCard = '<div class="card mb16"><div class="card-h"><span class="dot"></span><h3>④ 学生反馈与改进推送</h3>'
    + '<span class="sub">已收到 '+answered.length+' 份评价 · 平均 '+avg+' / 5</span></div>';
  if (answered.length){
    var rows = answered.map(function(a){
      var stars = "★".repeat(Math.max(1,Math.min(5,+a.score||3)))+"☆".repeat(5-Math.max(1,Math.min(5,+a.score||3)));
      return '<div class="ar-card" style="margin-bottom:8px"><div class="ar-head"><span class="who" style="font-size:13px">'+escapeHtml(a.who||"学生")+'</span>'
        + '<span class="tag t-a" style="margin-left:auto;color:#b45309">'+stars+'</span><span class="ts">'+fmtStamp(a.ts)+'</span></div>'
        + (a.note?'<div class="ar-body" style="padding:10px 15px;font-size:14px">'+escapeHtml(a.note)+'</div>':'')+'</div>';
    }).join("");
    feedbackCard += '<div>'+rows+'</div>'
      + '<div class="ck-label mt12">改进反馈（AI 起草，教师可改）</div>'
      + '<textarea id="evalText" class="mini-in" style="width:100%;min-height:88px;text-align:left">'+escapeHtml(STATE.evalDraft||"")+'</textarea>'
      + '<div class="row mt12" style="gap:8px"><button class="btn" onclick="UI.evalAI()">'+icon("bulb",15)+' AI 生成改进反馈</button>'
      + '<button class="btn pri" onclick="UI.evalPush()">'+icon("send",15)+' 推送反馈</button></div>';
  } else {
    feedbackCard += '<div class="empty" style="padding:26px">学生提交评价后，这里会展示每条反馈与平均分。</div>';
  }
  feedbackCard += '</div>';

  return filterBar()
    + tmHead("训练课评价", (STATE.gradeFilter||"全校")+" · 课程信息 → AI 问卷 → 学生反馈")
    + step + inputCard + surveyCard + feedbackCard;
}

/* 成长追踪页：训练打卡执行率卡片（仅教师/管理员可见，学生视图不展示） */
function renderExecCard(){
  const term = STATE.term;
  const today = todayStr();
  const wk = weekRange(today);
  const should = STUDENTS.filter(s => !makePrescription(s, term).keep);
  const shouldCount = should.length;
  const doneToday = should.filter(s => Checkin.get(s.id, today));
  const doneTodayCount = doneToday.length;
  const weekRecs = Checkin.range(wk[0], wk[1]);
  const weekSids = {};
  for (let i=0;i<weekRecs.length;i++) weekSids[weekRecs[i].sid] = 1;
  const weekDoneCount = Object.keys(weekSids).length;
  const rate = shouldCount ? Math.round(doneTodayCount / shouldCount * 100) : 0;
  const notDone = should.filter(s => !Checkin.get(s.id, today));
  const termName = (TERMS.find(t=>t.id===term) || {}).name || "";

  const notDoneHtml = notDone.length
    ? notDone.map(s => '<span class="ck-chip" onclick="UI.pick(\''+s.id+'\');UI.go(\'rx\')">'+s.name+'<i>'+s.id+'</i></span>').join("")
    : '<span class="ck-all">全部已打卡</span>';

  return ''
  + '<div class="card" style="border-color:var(--cyan)"><div class="card-h"><span class="dot" style="background:var(--cyan)"></span><h3>训练打卡执行率</h3>'
  + '<span class="sub">本周 '+wk[0]+' ~ '+wk[1]+' · '+termName+'</span></div>'
  + '<div class="grid g4 mb16">'
    + '<div class="kpi"><div class="kpi-l">应打卡人数</div><div class="kpi-v">'+shouldCount+'</div><div class="kpi-s">持有运动处方</div></div>'
    + '<div class="kpi green"><div class="kpi-l">今日已打卡</div><div class="kpi-v g">'+doneTodayCount+'</div><div class="kpi-s">'+today+'</div></div>'
    + '<div class="kpi cyan"><div class="kpi-l">本周累计打卡</div><div class="kpi-v c">'+weekDoneCount+'</div><div class="kpi-s">去重人次</div></div>'
    + '<div class="kpi purple"><div class="kpi-l">今日执行率</div><div class="kpi-v p">'+rate+'<span class="kpi-u">%</span></div><div class="kpi-s">已打卡 / 应打卡</div></div>'
  + '</div>'
  + '<div class="ck-exec-foot">'
    + '<div class="ck-sub">未打卡名单（今日 · '+notDone.length+' 人）'
    + (notDone.length ? '<button class="ck-toggle" onclick="UI.ckListToggle()">展开</button>' : '')
    + '</div>'
    + '<div id="ckNotDone" class="ck-list">'+notDoneHtml+'</div>'
  + '</div>'
  + '<div class="note note-ex cyan" style="margin-top:13px">口径说明：<b>应打卡</b>＝当前学期持有运动处方（存在薄弱项）的学生；<b>已打卡</b>＝当日在本机提交过打卡记录。数据全部来自浏览器本地存储，仅作课堂督导演示，不联网、不跨设备同步。</div>'
  + '</div>';
}

/* ---------------- 10. 顾问应答（规则 + 本机数据查询） ---------------- */
let LAST_STU = null;   // 最近一次提到过的学生，用于承接「他 / 她 / 这位同学」的指代

function answer(q){
  q = String(q||"").trim();
  if (!q) return "请输入问题。";

  // 指代消解：句中无姓名时，尝试承接上一轮提到的学生
  const named0 = STUDENTS.find(s=>q.indexOf(s.name)>=0);
  const pronoun = /(他|她|这位同学|该生|这名同学|这孩子)/.test(q);
  if (named0) LAST_STU = named0;
  const named = named0 || (pronoun && LAST_STU) || null;
  if (!named0 && pronoun && !LAST_STU){
    return "你提到的这位同学我还没确认是谁——请先说出姓名，例如「"+STUDENTS[0].name+" 想提升耐力」。之后这一轮里说「他」我就能接上了。";
  }

  // 医疗边界
  if (/(疼|痛|伤|病|头晕|胸闷|吃药|医院|就医|营养|减肥药)/.test(q)){
    return "关于身体不适、伤病判断或医疗相关的建议，我不适合回答，请交给校医或专业医疗机构处理。\n\n如果你告诉我“哪个项目想提升”，我可以给出对应的练习方法。";
  }

  // 系统使用
  if (/(怎么用|如何操作|流程|怎么导入|怎么录)/.test(q)){
    return "操作流程分三步：\n\n第一步，进入「多模态采集」录入体测数据，支持网页逐项填写、Excel 批量导入。\n第二步，「国标测评」会按 2014 修订国标自动算分评级，不需要人工查表。\n第三步，「AI 运动处方」针对得分低于 72 分的项目生成处方，教师审定后签发给学生。\n\n全过程在本机完成，不联网，数据不出校。";
  }

  // 班级薄弱项
  if (/(班级|全班|班里).*(最弱|薄弱|最差|哪几项)|哪几项最弱|最弱的是/.test(q)){
    const st = classStats(STATE.term);
    const sorted = ITEMS.map(i=>({n:i.name, v:st.partAvg[i.key], w:i.w})).sort((a,b)=>a.v-b.v);
    const s = sorted.slice(0,3).map((x,i)=>(i+1)+". "+x.n+"（"+x.v+" 分，权重 "+x.w+"%）").join("\n");
    return "当前测评班级各项目平均分从低到高：\n\n"+s+"\n\n"+sorted[0].n+"是最突出的共性短板，建议在体育课的基本部分集中安排针对性练习，练习密度目标控制在 60% 以上。";
  }

  // 班级统计
  if (/(及格率|优良率|平均分|达标率|班级情况|整体)/.test(q)){
    const st = classStats(STATE.term);
    return "当前测评班级统计：\n\n平均分 "+st.avg+" 分\n优良率 "+st.goodRate+"%（优秀 "+st.lv.优秀+" 人，良好 "+st.lv.良好+" 人）\n及格率 "+st.passRate+"%\n不及格 "+st.lv.不及格+" 人\n\n国标规定学年总分良好及以上方可参加评优评奖，建议重点盯住临近 80 分的学生。";
  }

  // 某学生：进步比较
  if (named && /(进步|上次|变化|提高|退步|第三次|对比)/.test(q)){
    const a = getScore(named,"t1"), b = getScore(named, STATE.term);
    const d = Math.round((b.total-a.total)*10)/10;
    let detail = "";
    ITEMS.forEach(i=>{
      const dv = b.parts[i.key].score - a.parts[i.key].score;
      if (Math.abs(dv) >= 5) detail += "\n· "+itemName(named.gender,i.key)+"：" +a.parts[i.key].score+" → "+b.parts[i.key].score+"（"+(dv>0?"+":"")+dv+"）";
    });
    return named.name+"总分从 "+a.total+" 提升到 "+b.total+"，累计 "+(d>0?"+":"")+d+" 分，等级由 "+a.level+" 变为 "+b.level+"。\n\n变化较大的项目：" + (detail || "无单项变化超过 5 分") +
      "\n\n下一步建议保持当前训练节奏，把重点放在尚未到 80 分的项目上。";
  }

  // 某学生：处方
  if (named && /(处方|怎么练|训练|练什么|提升)/.test(q)){
    const rx = makePrescription(named, STATE.term);
    const sc = getScore(named, STATE.term);
    if (rx.keep){
      return named.name+"本次总分 "+sc.total+"（"+sc.level+"），各项目均在 72 分以上，无需针对性补弱。建议维持现有锻炼习惯，以优势项目带动全面发展。";
    }
    let s = named.name+"总分 "+sc.total+"（"+sc.level+"），薄弱项为：\n\n";
    s += rx.focus.map(f=>"· "+f.name+" "+f.score+" 分").join("\n");
    s += "\n\n【"+rx.items[0].name+"】"+rx.items[0].lib.title+"\n";
    rx.items[0].lib.items.forEach(it=>{ s += "\n· "+it.t+"：" + it.d; });
    s += "\n\n"+rx.items[0].lib.tip;
    return s;
  }

  // 某学生：总览
  if (named){
    const sc = getScore(named, STATE.term);
    const parts = ITEMS.map(i=>i.name+" "+sc.parts[i.key].score).join("，");
    const sorted = ITEMS.map(i=>({n:itemName(named.gender,i.key), v:sc.parts[i.key].score})).sort((a,b)=>a.v-b.v);
    return named.name+"（"+named.id+"，"+(named.gender==="M"?"男":"女")+"）本次测评：\n\n总分 "+sc.total+" 分，"+"等级 "+sc.level+"\nBMI "+sc.bmi+"（"+sc.bmiGrade+"）\n\n各单项得分："+parts+"\n\n最弱的一项是"+sorted[0].n+"（"+sorted[0].v+" 分）。输入“"+named.name+" 怎么练”可以获取处方。";
  }

  // 单个项目怎么练
  const itemsMap = [
    [/耐力|1000|800|跑步|长跑/, "endur"], [/体前屈|柔韧/, "reach"], [/引体|上肢/, "pullup"],
    [/仰卧起坐|核心|腹肌/, "situp"], [/跳远|爆发力|弹跳/, "jump"], [/50 米|短跑|速度|起跑/, "run50"],
    [/肺活量|心肺/, "vc"], [/体重|BMI|超重|肥胖|偏瘦|体型/, "bmi_high"]
  ];
  for (const r of itemsMap){
    if (r[0].test(q)){
      const lib = RX_LIB[r[1]];
      let s = "【"+lib.title+"】\n\n";
      lib.items.forEach(it=>{ s += "· "+it.t+"：" + it.d + "\n"; });
      s += "\n"+lib.tip;
      s += "\n\n想针对某位学生生成完整处方，请告诉我他的姓名，或到「AI 运动处方」板块查看。";
      return s;
    }
  }

  // 知识库兜底检索（带出处）——让顾问对未预设的问题也能基于本地知识回答
  if (typeof KB!=="undefined" && KB.ready){
    var hits = KB.search(q, {limit:10}).filter(function(h){
      return h && h.doc && h.doc.kind!=="题目" && String(h.doc.body||"").length>40;
    }).slice(0,3);
    if (hits.length){
      var s = "根据本地知识库：\n";
      var srcs={};
      hits.forEach(function(h){
        var t="", lines=String(h.doc.body||"").split("\n");
        for (var z=0;z<lines.length;z++){
          var L=lines[z].trim();
          if (/^【(出处|适用|学段|水平|场景)】/.test(L)) continue;
          if (L.length>=25){ t=L; break; }
        }
        if(!t) t=String(h.doc.body||"").replace(/^【[^】]*】/,"").trim();
        if (t.length>200) t=t.slice(0,200)+"…";
        s += "\n· "+t; srcs[h.doc.src]=1;
      });
      s += "\n\n【知识出处】"+Object.keys(srcs).join("；");
      return s;
    }
  }
  return "这个问题我暂时答不上来。我可以帮你查：\n\n· 某个学生的总分、单项得分、BMI（直接说姓名）\n· 学生跨学期的进步对比\n· 针对薄弱项的运动处方\n· 班级平均分、及格率、优良率\n· 某个项目的训练方法\n\n例如试试输入「"+STUDENTS[5].name+" 的薄弱项」。";
}

  evalGenSurvey(){

    var content=(document.getElementById("evContent")||{}).value||"";
    var target=(document.getElementById("evalTarget")||{}).value||"全体学生";
    if (!String(course).trim()){ alert("请先填写课程主题"); return; }
    STATE.evalCourse = String(course).trim();
    STATE.evalTarget = target;
    /* 问卷严格围绕输入的课程主题与练习内容生成，不使用班级薄弱项 */
    var focus = "";
    var kmap = [
      ["立定跳远",["立定跳远","跳远","弹跳","跳跃","蛙跳"]],
      ["50米跑",["50米","五十米","短跑","速度","起跑","冲刺"]],
      ["耐力跑",["1000米","800米","耐力","中长跑","长跑","跑步"]],
      ["引体向上",["引体向上","引体","上肢力量"]],
      ["仰卧起坐",["仰卧起坐","核心力量","腹肌"]],
      ["坐位体前屈",["坐位体前屈","柔韧","拉伸"]],
      ["肺活量",["肺活量","呼吸","吹气"]],
      ["深蹲",["深蹲","蹲起","下肢力量"]]
    ];
    var allText = course + " " + content;
    for (var ki=0; ki<kmap.length; ki++){
      var kw = kmap[ki][1];
      for (var kj=0; kj<kw.length; kj++){ if (allText.indexOf(kw[kj])>=0){ focus = kmap[ki][0]; break; } }
      if (focus) break;
    }
    if (!focus) focus = course.slice(0,12);
    var qs = [
      "本节课「"+focus+"」的练习强度是否适合你？",
      "老师对「"+focus+"」动作要领的讲解是否清楚？",
      "通过本节课「"+focus+"」的练习，你的动作是否更规范了？",
      "你在课堂上完成「"+focus+"」动作的信心如何？",
      "关于「"+focus+"」，你希望下节课在哪些方面多做指导？（选填）"
    ];
    Engage.add("surveys", { course:STATE.evalCourse, content:String(content).trim(), target:target, qs:qs, published:true });
    STATE.evalAns = {};
    alert("AI 已生成本节课问卷，并发布到学生端");

    const el = document.getElementById("chatIn");
    if (!el) return;
    const v = el.value.trim();
    if (!v) return;
    el.value = "";
    this.ask(v);
  },
  /* ---------- 处方页追问 ---------- */
  rxAsk(){
    const el = document.getElementById("rxAskIn");
    if (!el) return;
    const q = String(el.value || "").trim();
    if (!q) return;
    const stu = STUDENTS.find(s=>s.id===STATE.stuId) || STUDENTS[0];
    let a = "";
    try { a = answerRx(q, stu); }
    catch(e){ a = "回答生成出错：" + (e && e.message ? e.message : e); }
    if (!STATE.askLog) STATE.askLog = [];
    STATE.askLog.push({ stu: stu.id, q: q, a: a });
    if (STATE.askLog.length > 20) STATE.askLog = STATE.askLog.slice(-20);
    el.value = "";
    this.go("rx");
    const box = document.getElementById("rxAskIn");
    if (box && box.focus) box.focus();
  },
  rxQuick(q){
    const el = document.getElementById("rxAskIn");
    if (el) el.value = q;
    this.rxAsk();
  },
  /* ---- 处方闭环：选学生 → 生成 → 编辑 → 审核 → 推送 → 更正 ---- */
  rxPick(id){
    STATE.stuId = id;
    STATE.rxDraftFor = "";
    STATE.rxDraftText = "";
    STATE.rxReviewed = false;
    STATE.rxEditOpen = false;
    this.go("rx");
  },
  rxGenerate(id){
    var s = STUDENTS.find(function(x){return x.id===id;}) || STUDENTS[0];
    STATE.rxDraftFor = id;
    STATE.rxDraftText = rxDraftText(s, STATE.term);
    STATE.rxReviewed = false;
    STATE.rxEditOpen = false;
    Engage.add("rxlog", { sid:id, term:STATE.term, status:"draft", plan:STATE.rxDraftText, editor:(STATE.user?STATE.user.name:"体育老师") });
    this.go("rx");
  },
  rxSaveDraft(){
    var ta = document.getElementById("rxText");
    if (!ta) return;
    STATE.rxDraftText = String(ta.value||"");
    STATE.rxReviewed = false;
    var logs = Engage.list("rxlog");
    var last = null;
    for (var i=0;i<logs.length;i++) if (logs[i].sid===STATE.rxDraftFor && logs[i].status!=="pushed") last=logs[i];
    if (last) Engage.update("rxlog", last.id, { plan:STATE.rxDraftText, status:"edited", editNote:"教师已修改", ts:Date.now() });
    alert("修改已保存，请审核后再推送");
    this.go("rx");
  },
  rxReview(){
    var ta = document.getElementById("rxText");
    if (ta) STATE.rxDraftText = String(ta.value||"");
    if (!String(STATE.rxDraftText||"").trim()){ alert("处方内容为空，不能审核"); return; }
    STATE.rxReviewed = true;
    var logs = Engage.list("rxlog");
    var last = null;
    for (var i=0;i<logs.length;i++) if (logs[i].sid===STATE.rxDraftFor && logs[i].status!=="pushed") last=logs[i];
    if (last) Engage.update("rxlog", last.id, { plan:STATE.rxDraftText, status:"reviewed", reviewedBy:(STATE.user?STATE.user.name:"体育老师") });
    else Engage.add("rxlog", { sid:STATE.rxDraftFor, term:STATE.term, status:"reviewed", plan:STATE.rxDraftText, editor:(STATE.user?STATE.user.name:"体育老师") });
    this.go("rx");
  },
  rxPush(id){
    var ta = document.getElementById("rxText");
    var plan = ta ? String(ta.value||"") : (STATE.rxDraftText||"");
    if (!String(plan).trim()){ alert("处方内容为空，不能推送"); return; }
    var s = STUDENTS.find(function(x){return x.id===id;}) || STUDENTS[0];
    /* 找到当前草稿记录，改为 pushed；否则新建一条 */
    var logs = Engage.list("rxlog"), cur=null;
    for (var i=0;i<logs.length;i++) if (logs[i].sid===id && logs[i].status!=="pushed") cur=logs[i];
    if (cur) Engage.update("rxlog", cur.id, { status:"pushed", plan:plan, pushTs:Date.now(), editor:(STATE.user?STATE.user.name:"体育老师") });
    else Engage.add("rxlog", { sid:id, term:STATE.term, status:"pushed", plan:plan, pushTs:Date.now(), editor:(STATE.user?STATE.user.name:"体育老师") });
    STATE.pushedRx = id;
    STATE.rxDraftFor = "";
    STATE.rxReviewed = false;
    alert("已推送到 "+s.name+" 的学生端，学生登录后即可查看");
    this.go("rx");
  },
  rxReedit(id){
    var p = rxPushedOf(id);
    STATE.rxDraftFor = id;
    STATE.rxDraftText = p ? p.plan : "";
    STATE.rxReviewed = false;
    STATE.rxEditOpen = true;
    this.go("rx");
  },
  /* 保留兼容：旧调用入口 */
  pushRx(id){ this.rxPush(id); },
  /* ---------- 训练打卡 ---------- */
  ckPick(btn){
    const all = document.querySelectorAll(".ck-b");
    for (let i=0;i<all.length;i++) all[i].classList.remove("on");
    if (btn) btn.classList.add("on");
    const inp = document.getElementById("ckSel");
    if (inp) inp.value = btn ? btn.getAttribute("data-v") : "";
    const w = document.getElementById("ckWarn");
    if (w) w.style.display = "none";
  },
  ckSubmit(){
    const sel = document.getElementById("ckSel");
    const status = sel ? sel.value : "";
    if (!status){
      const w = document.getElementById("ckWarn");
      if (w) w.style.display = "inline";
      return;
    }
    const noteEl = document.getElementById("ckNote");
    const note = noteEl ? (noteEl.value||"").trim() : "";
    const sid = STATE.stuId, date = todayStr();
    Checkin.put(sid, date, { status:status, note:note, time:nowStr() });
    this.go("rx");
  },
  ckListToggle(){
    const el = document.getElementById("ckNotDone");
    if (!el) return;
    const open = el.classList.toggle("open");
    const btn = document.querySelector(".ck-toggle");
    if (btn) btn.textContent = open ? "收起" : "展开";
  },
  /* ---------- 批量导入 ---------- */
  pickFile(input){
    if (!canEdit()){
      STATE.importErr = "当前是学生视图，不能导入或修改成绩。请用教师或管理员账号登录。";
      this.go("capture");
      return;
    }
    onImpFile(input);
  },
  tpl(){ downloadTpl(); },
  applyImp(){ applyImport(); },
  cancelImp(){ cancelImport(); },
  /* ---------- 本地存档状态 ---------- */
  saveChip(){
    const el = document.getElementById("saveChip");
    if (!el) return;
    if (!Store.ok){
      el.innerHTML = '<div class="save-chip warn" title="当前环境未开放本地存储，改动只保留在本次会话中，刷新即还原">'
        + '<span class="save-dot warn"></span>未启用存档</div>';
      return;
    }
    const n = Store.count(), p = Store.students();
    if (!n){ el.innerHTML = ""; return; }
    el.innerHTML = '<div class="save-chip" title="改动已写入本机存储，关闭浏览器或刷新后仍然保留">'
      + '<span class="save-dot"></span>存档 ' + n + ' 处修改 · ' + p + ' 人'
      + '<span class="save-x" onclick="UI.resetData()" title="清空本地存档，恢复初始数据">还原</span></div>';
  },
  resetData(){
    const n = Store.count();
    if (!n) return;
    const go = (typeof window.confirm === "function")
      ? window.confirm("确定清空本地存档吗？\n\n将丢弃累计的 " + n + " 处修改，恢复系统初始数据。")
      : true;
    if (!go) return;
    Store.clear();
    const fresh = buildStudents();
    STUDENTS.length = 0;
    for (let i=0;i<fresh.length;i++) STUDENTS.push(fresh[i]);
    TERMS.forEach(t => STUDENTS.forEach(s => invalidateCache(s.id, t.id)));
    STATE.editNote = "";
    STATE.importResult = null;
    STATE.stuId = STUDENTS[0].id;
    this.saveChip();
    this.go(STATE.page);
  },
  /* ---------- 语音成绩复核 ---------- */
  voiceStuPick(id){ STATE.voiceStu = id; STATE.voiceMsg = ""; this.go("capture"); },
  voicePlay(){
    STATE.voiceMsg = "";
    if (!supportsSpeech()){ STATE.voiceMsg = "当前环境不支持语音合成，朗读已停用。"; this.go("capture"); return; }
    const lines = voiceLines(voiceTarget());
    STATE.voiceOn = true; STATE.voiceIdx = 0;
    this.go("capture");
    const self = this;
    window.setTimeout(function(){ speakSeq(lines, 0); }, 90);
  },
  voiceStop(){
    try { window.speechSynthesis.cancel(); } catch(e){}
    STATE.voiceOn = false;
    STATE.voiceMsg = "已停止朗读。";
    voiceHighlight(-1);
    this.go("capture");
  },
  /* ---------- 摄像头拍照留档 ---------- */
  camOpen(){
    STATE.camErr = "";
    if (!canEdit()){ STATE.camErr = "当前是学生视图，不能采集成绩。请用教师或管理员账号登录。"; this.go("capture"); return; }
    const md = (typeof navigator !== "undefined" && navigator.mediaDevices) ? navigator.mediaDevices : null;
    if (!md || typeof md.getUserMedia !== "function"){
      STATE.camErr = "此环境下浏览器未提供摄像头接口（navigator.mediaDevices 不可用，常见于 http 非加密来源或旧版内核）。可改用「从相册选择」，或直接看交互演示。";
      this.go("capture"); return;
    }
    STATE.camBusy = true;
    this.go("capture");
    const self = this;
    md.getUserMedia({ video:{ facingMode:"environment", width:{ ideal:1280 } }, audio:false })
      .then(function(stream){
        CAM = stream;
        STATE.camBusy = false; STATE.camLive = true; STATE.camErr = "";
        self.go("capture");
        window.setTimeout(function(){
          const v = document.getElementById("camVideo");
          if (v){ try { v.srcObject = stream; v.play(); } catch(e){} }
        }, 60);
      })
      .catch(function(err){
        STATE.camBusy = false; STATE.camLive = false;
        STATE.camErr = camErrText(err);
        self.go("capture");
      });
  },
  camShoot(){
    const v = document.getElementById("camVideo");
    if (!v || !v.videoWidth){ STATE.camErr = "画面尚未就绪，请稍等一秒再拍。"; this.go("capture"); return; }
    const c = newCanvas();
    if (!c){ STATE.camErr = "此浏览器不支持画布，无法抓帧。"; this.go("capture"); return; }
    try {
      const w = v.videoWidth, h = v.videoHeight;
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(v, 0, 0, w, h);
      const url = c.toDataURL("image/jpeg", 0.82);
      STATE.photo = { src:url, w:w, h:h, kb: Math.max(1, Math.round(url.length * 0.75 / 1024)) };
      STATE.camErr = "";
      this.camClose(false);
      if (STATE.served) uploadPhoto(STATE.photo, { name: curStuName(), stuId: STATE.stuId });
      this.go("capture");
    } catch(e){
      STATE.camErr = "抓帧失败：" + ((e && e.message) || "未知原因");
      this.go("capture");
    }
  },
  camClose(rerender){
    if (CAM){ try { CAM.getTracks().forEach(function(t){ t.stop(); }); } catch(e){} CAM = null; }
    STATE.camLive = false; STATE.camBusy = false;
    if (rerender !== false) this.go("capture");
  },
  camPick(input){
    STATE.camErr = "";
    if (!canEdit()){ STATE.camErr = "当前是学生视图，不能上传成绩单照片。"; if (input) input.value = ""; this.go("capture"); return; }
    const f = input && input.files && input.files[0];
    if (!f) return;
    if (!/^image\//.test(f.type)){ STATE.camErr = "请选择图片文件（JPG / PNG）。"; input.value = ""; this.go("capture"); return; }
    if (typeof FileReader === "undefined"){ STATE.camErr = "此环境不支持读取本地文件。"; input.value = ""; this.go("capture"); return; }
    const rd = new FileReader(), self = this;
    rd.onload = function(ev){
      const url = String(ev.target.result);
      const im = new Image();
      im.onload = function(){
        STATE.photo = { src:url, w:im.width, h:im.height, kb: Math.max(1, Math.round(f.size/1024)) };
        STATE.camErr = "";
        if (STATE.served) uploadPhoto(STATE.photo, { name: curStuName(), stuId: STATE.stuId });
        self.go("capture");
      };
      im.onerror = function(){ STATE.camErr = "图片解析失败，请换一张重试。"; input.value = ""; self.go("capture"); };
      im.src = url;
    };
    rd.onerror = function(){ STATE.camErr = "图片读取失败。"; input.value = ""; self.go("capture"); };
    rd.readAsDataURL(f);
  },
  camClear(){ STATE.photo = null; STATE.camErr = ""; this.go("capture"); },
  /* ---------- Prompt 台账 ---------- */
  plog(i){
    const k = STATE.plOpen.indexOf(i);
    if (k >= 0) STATE.plOpen.splice(k, 1); else STATE.plOpen.push(i);
    this.go("trace");
  },
  copyPrompt(i){
    const p = PROMPTS[i];
    const t = p && p.raw ? p.raw : "";
    if (!t){ STATE.copyMsg = "该步骤原本就没有提示词输入，无可复制内容。"; this.go("trace"); return; }
    let done = false, err = "";
    try {
      if (typeof navigator !== "undefined" && navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(t).then(function(){}, function(){ });
        done = true;
      }
    } catch(e){ err = e.message; }
    if (!done){
      try {
        const ta = document.createElement("textarea");
        ta.value = t;
        ta.style.position = "fixed"; ta.style.top = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        done = document.execCommand("copy");
        document.body.removeChild(ta);
      } catch(e){ err = e.message; done = false; }
    }
    STATE.copyMsg = done
      ? "第 " + (i+1) + " 条（" + p.stage + "）原文已复制到剪贴板，可直接粘贴进开发应用报告。"
      : "复制失败" + (err ? "：" + err : "") + "，请展开后手动选中文本框内容复制。";
    this.go("trace");
  },
  /* ---------- 扫码进入 ---------- */
  fillLoginQR(){
    var el = document.getElementById("loginQR");
    if (!el) return;
    if (!STATE.served){
      el.innerHTML = '<div class="qr-tip" style="margin-top:8px;line-height:1.9">'
        + '<div style="font-size:14px;font-weight:700;color:#16202f;margin-bottom:8px">校园网访问</div>'
        + '启动本地服务后，学生可用手机扫码登录，查看本人测评结果与运动处方。<br>'
        + '本机可直接用账号登录。</div>';
      return;
    }
    var url = guestUrl();
    el.innerHTML = '<div class="qr-card"><div class="qr-cap">扫码在手机 / 平板上打开</div>'
      + qrSvg(url, 172, 3)
      + '<div class="qr-url">'+escapeHtml(url)+'</div>'
      + '<div class="qr-tip">用本人账号密码登录。学生登录后仅可查看自己的测评结果与处方。</div></div>';
  },
  openQR(){
    var b = document.getElementById("qrModalBody");
    var m = document.getElementById("qrModal");
    if (b){
      if (STATE.served){
        var u = guestUrl();
        b.innerHTML = qrSvg(u, 240, 4)
          + '<div class="qr-url" style="margin-top:12px">'+escapeHtml(u)+'</div>'
          + '<ol class="steps" style="margin-top:14px"><li>用手机 / 平板相机扫码打开登录页，输入本人账号密码。</li>'
          + '<li>学生登录后查看本人测评结果、运动处方与健康知识库。</li>'
          + '<li>登录后账号即确定身份，教师 / 学生 / 管理员各自独立、不可切换。</li></ol>';
      } else {
        b.innerHTML = '<div class="qr-tip">当前未启动本地服务，无法生成局域网二维码。请在校园网环境下启动本地服务后再扫码。</div>';
      }
    }
    if (m) m.classList.add("on");
  },
  closeQR(){
    var m = document.getElementById("qrModal");
    if (m) m.classList.remove("on");
  }
};

/* ---------------- 12. 启动 ---------------- */
(function init(){
  /* 选择器区域滚轮独立：鼠标在该区域内滚动不带动下方整页 */
  document.addEventListener("wheel", function(e){
    var t = e.target;
    while (t && t !== document.body){
      if (t.classList && t.classList.contains("track-pick")){
        var canUp = t.scrollTop > 0;
        var canDown = t.scrollTop + t.clientHeight < t.scrollHeight - 1;
        if ((e.deltaY<0 && canUp) || (e.deltaY>0 && canDown)) e.stopPropagation();
        return;
      }
      t = t.parentElement;
    }
  }, { passive:true });
  Store.init();
  KBEdit.init();
  Checkin.init();
  Engage.init();
  /* 知识库后台异步装载：先让登录页秒开，2.8MB 数据在后台下载解析完成后再激活检索 */
  (function loadKBAsync(){
    function activate(){
      if (typeof KB!=="undefined" && window.KB_DOCS && window.KB_DOCS.length){
        KB.load(window.KB_DOCS, window.KB_META);
        KBEdit.apply();       /* 原始库装载完成后，重新叠加管理员的自建/修改/隐藏内容 */
        STATE.kbLoaded = true;
        /* 若当前停留的页面依赖知识库，装载完成后就地重渲染一次 */
        var p = STATE.page;
        if (p==="kb"||p==="s_kb"||p==="coach"||p==="s_ask"||p==="askReview"||p==="rx"||p==="s_rx"||p==="rxEffect"||p==="quizBank"||p==="s_quiz"||p==="home"||p==="s_home"){
          try { UI.go(p, true); } catch(e){}
        }
      }
    }
    /* 若数据已随页面内联提供则直接激活，否则动态注入脚本 */
    if (window.KB_DOCS && window.KB_DOCS.length){ activate(); return; }
    var s = document.createElement("script");
    s.src = "kb_data.js";
    s.async = true;
    s.onload = activate;
    s.onerror = function(){
      STATE.kbError = true;
      /* 装载失败不改变首屏，知识库相关函数已有 ready 守卫 */
    };
    (document.head||document.body).appendChild(s);
  })();
  STATE.served = !!shareUrl();
  try { document.body.classList.toggle("clean", STATE.clean); } catch(e){}
  // 统一走账号登录页：三类账号各自独立，登录后按角色进入对应端，不提供访客/切换捷径
  UI.loginRender();
  UI.fillLoginQR();
  UI.nav();
  UI.roles();
  UI.chip();
  UI.mode();
  UI.go("home");
  window.UI = UI;
})();
</script>
