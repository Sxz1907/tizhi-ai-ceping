function renderTrack(){
  const stu = STUDENTS.find(s=>s.id===STATE.stuId) || STUDENTS[0];
  const scores = TERMS.map(t=>getScore(stu, t.id).total);
  const st = TERMS.map(t=>classStats(t.id));
  const G = stu.gender;

  const itemSeries = ITEMS.map(i=>{
    const data = TERMS.map(t=>getScore(stu,t.id).parts[i.key].score);
    const delta = data[2] - data[0];
    const col = delta>0?"#15803d":delta<0?"#dc2626":"#5d6d85";
    return '<tr><td>'+itemName(G,i.key)+'</td>'
      + TERMS.map((t,idx)=>'<td class="num" style="text-align:right;color:'+scoreColor(data[idx])+';font-weight:700">'+data[idx]+'</td>').join("")
      + '<td class="num" style="text-align:right;font-weight:800;color:'+col+'">'+(delta>0?"+":"")+delta+'</td>'
      + '<td><span class="tag '+(delta>4?"t-g":delta>=0?"t-b":"t-r")+'">'+(delta>4?"明显提升":delta>=0?"稳中有进":"需关注")+'</span></td></tr>';
  }).join("");

  const clsSeries = TERMS.map(t=>st[TERMS.indexOf(t)].avg);
  const passSeries = TERMS.map(t=>st[TERMS.indexOf(t)].passRate);
  const goodSeries = TERMS.map(t=>st[TERMS.indexOf(t)].goodRate);

  const improve = visibleStudents().map(s=>{
    const a = getScore(s,"t1").total, b = getScore(s,STATE.term).total;
    return { s, d: Math.round((b-a)*10)/10, a, b };
  }).sort((x,y)=>y.d-x.d);
  const up = improve.filter(x=>x.d>0).length;

  return ''
  + '<div class="note note-ex mb16"><b>为什么要有这一页</b>：体测是每年一次的国家要求，但学生的变化是连续的。只看单次成绩，教师看到的是“谁不及格”；把三次测评连起来看，才能回答“谁在进步”“哪些干预真的起了作用”。这一页也是向家长和学生反馈时最有说服力的证据。</div>'
  + (isStudent() ? '' : renderExecCard())
  + '<div class="grid g4 mb16">'
    + '<div class="kpi green"><div class="kpi-l">'+stu.name+' 三次总分</div><div class="kpi-v g">'+scores[0]+' → '+scores[2]+'</div><div class="kpi-s">累计 '+(scores[2]-scores[0]>0?"+":"")+Math.round((scores[2]-scores[0])*10)/10+' 分</div></div>'
    + '<div class="kpi blue"><div class="kpi-l">班级平均分走势</div><div class="kpi-v b">'+clsSeries[0]+' → '+clsSeries[2]+'</div><div class="kpi-s">'+TERMS[0].name+' 起</div></div>'
    + '<div class="kpi cyan"><div class="kpi-l">及格率变化</div><div class="kpi-v c">'+passSeries[0]+' → '+passSeries[2]+'<span class="kpi-u">%</span></div><div class="kpi-s">持续跟踪三个学期</div></div>'
    + '<div class="kpi purple"><div class="kpi-l">成绩提升人数</div><div class="kpi-v p">'+up+'<span class="kpi-u">/ '+STUDENTS.length+'</span></div><div class="kpi-s">相对首次测评</div></div>'
  + '</div>'
  + '<div class="grid g2 mb16">'
    + '<div class="card"><div class="card-h"><span class="dot"></span><h3>'+stu.name+' · 总分变化</h3><span class="sub">'+stu.id+'</span></div>'
      + lineChart([{ data: scores, color:"#2563eb" }], TERMS.map(t=>t.label), 520, 200)
      + '<div class="tbl-wrap mt12"><table class="tb"><thead><tr><th>项目</th>'
        + TERMS.map(t=>'<th style="text-align:right">'+t.label+'</th>').join("")
        + '<th style="text-align:right">变化</th><th style="text-align:right">判断</th></tr></thead><tbody>'+itemSeries+'</tbody></table></div>'
    + '</div>'
    + '<div class="card"><div class="card-h"><span class="dot"></span><h3>班级整体趋势</h3><span class="sub">平均分 / 及格率 / 优良率</span></div>'
      + lineChart([
          { data: clsSeries,  color:"#2563eb" },
          { data: passSeries, color:"#f59e0b" },
          { data: goodSeries, color:"#15803d" }
        ], TERMS.map(t=>t.label), 520, 196)
      + '<div class="legend" style="justify-content:center;margin-top:10px">'
        + '<span><i style="background:#2563eb"></i>平均分</span><span><i style="background:#f59e0b"></i>及格率 %</span><span><i style="background:#15803d"></i>优良率 %</span></div>'
      + '<div class="tbl-wrap mt12"><table class="tb"><thead><tr><th>进步最多</th><th style="text-align:right">起始</th><th style="text-align:right">当前</th><th style="text-align:right">提升</th></tr></thead><tbody>'
        + improve.slice(0,5).map(x=>'<tr onclick="UI.pick(\''+x.s.id+'\')" style="cursor:pointer"><td><b>'+x.s.name+'</b></td><td class="num" style="text-align:right">'+x.a+'</td><td class="num" style="text-align:right">'+x.b+'</td><td class="num" style="text-align:right;color:#15803d;font-weight:800">+'+x.d+'</td></tr>').join("")
        + '</tbody></table></div>'
    + '</div>'
  + '</div>'
  + '<div class="card"><div class="card-h"><span class="dot"></span><h3>切换到其他学生</h3><span class="sub">点击卡片查看其成长曲线</span></div>'
    + '<div class="stu-grid">'
    + STUDENTS.slice(0,12).map(s=>{
        const a=getScore(s,"t1").total,b=getScore(s,STATE.term).total;
        return '<div class="stu-c '+(s.id===STATE.stuId?"on":"")+'" onclick="UI.pick(\''+s.id+'\');UI.go(\'track\')">'
          + '<div class="stu-nm">'+s.name+'</div><div class="stu-id">'+s.id+'</div>'
          + '<div class="stu-sc" style="color:'+scoreColor(b)+'">'+b+'<span style="font-size:12px;color:#8b99ad;font-weight:600"> (首 '+a+')</span></div>'
          + '<div class="stu-meta" style="color:'+(b>=a?"#15803d":"#dc2626")+'">'+(b>=a?"+":"")+Math.round((b-a)*10)/10+'</div></div>';
      }).join("")
    + '</div></div>';
}

/* 成长追踪页：训练打卡执行率卡片（仅教师/管理员可见，学生视图不展示） */
function renderExecCard(){
  const term = STATE.term;
  const today = todayStr();
  const wk = weekRange(today);
  const should = STUDENTS.filter(s => !makePrescription(s, term).keep);
  const shouldCount = should.length;
  const doneToday = should.filter(s => Checkin.get(s.id, today));
  const doneTodayCount = doneToday.length;
  const weekRecs = Checkin.range(wk[0], wk[1]);
  const weekSids = {};
  for (let i=0;i<weekRecs.length;i++) weekSids[weekRecs[i].sid] = 1;
  const weekDoneCount = Object.keys(weekSids).length;
  const rate = shouldCount ? Math.round(doneTodayCount / shouldCount * 100) : 0;
  const notDone = should.filter(s => !Checkin.get(s.id, today));
  const termName = (TERMS.find(t=>t.id===term) || {}).name || "";

  const notDoneHtml = notDone.length
    ? notDone.map(s => '<span class="ck-chip" onclick="UI.pick(\''+s.id+'\');UI.go(\'rx\')">'+s.name+'<i>'+s.id+'</i></span>').join("")
    : '<span class="ck-all">全部已打卡</span>';

  return ''
  + '<div class="card" style="border-color:var(--cyan)"><div class="card-h"><span class="dot" style="background:var(--cyan)"></span><h3>训练打卡执行率</h3>'
  + '<span class="sub">本周 '+wk[0]+' ~ '+wk[1]+' · '+termName+'</span></div>'
  + '<div class="grid g4 mb16">'
    + '<div class="kpi"><div class="kpi-l">应打卡人数</div><div class="kpi-v">'+shouldCount+'</div><div class="kpi-s">持有运动处方</div></div>'
    + '<div class="kpi green"><div class="kpi-l">今日已打卡</div><div class="kpi-v g">'+doneTodayCount+'</div><div class="kpi-s">'+today+'</div></div>'
    + '<div class="kpi cyan"><div class="kpi-l">本周累计打卡</div><div class="kpi-v c">'+weekDoneCount+'</div><div class="kpi-s">去重人次</div></div>'
    + '<div class="kpi purple"><div class="kpi-l">今日执行率</div><div class="kpi-v p">'+rate+'<span class="kpi-u">%</span></div><div class="kpi-s">已打卡 / 应打卡</div></div>'
  + '</div>'
  + '<div class="ck-exec-foot">'
    + '<div class="ck-sub">未打卡名单（今日 · '+notDone.length+' 人）'
    + (notDone.length ? '<button class="ck-toggle" onclick="UI.ckListToggle()">展开</button>' : '')
    + '</div>'
    + '<div id="ckNotDone" class="ck-list">'+notDoneHtml+'</div>'
  + '</div>'
  + '<div class="note cyan" style="margin-top:13px">口径说明：<b>应打卡</b>＝当前学期持有运动处方（存在薄弱项）的学生；<b>已打卡</b>＝当日在本机提交过打卡记录。数据全部来自浏览器本地存储，仅作课堂督导演示，不联网、不跨设备同步。</div>'
  + '</div>';
}

/* ---------------- 10. 顾问应答（规则 + 本机数据查询） ---------------- */
let LAST_STU = null;   // 最近一次提到过的学生，用于承接「他 / 她 / 这位同学」的指代

function answer(q){
  q = String(q||"").trim();
  if (!q) return "请输入问题。";

  // 指代消解：句中无姓名时，尝试承接上一轮提到的学生
  const named0 = STUDENTS.find(s=>q.indexOf(s.name)>=0);
  const pronoun = /(他|她|这位同学|该生|这名同学|这孩子)/.test(q);
  if (named0) LAST_STU = named0;
  const named = named0 || (pronoun && LAST_STU) || null;
  if (!named0 && pronoun && !LAST_STU){
    return "你提到的这位同学我还没确认是谁——请先说出姓名，例如「"+STUDENTS[0].name+" 想提升耐力」。之后这一轮里说「他」我就能接上了。";
  }

  // 医疗边界
  if (/(疼|痛|伤|病|头晕|胸闷|吃药|医院|就医|营养|减肥药)/.test(q)){
    return "关于身体不适、伤病判断或医疗相关的建议，我不适合回答，请交给校医或专业医疗机构处理。\n\n如果你告诉我“哪个项目想提升”，我可以给出对应的练习方法。";
  }

  // 系统使用
  if (/(怎么用|如何操作|流程|怎么导入|怎么录)/.test(q)){
    return "操作流程分三步：\n\n第一步，进入「多模态采集」录入体测数据，支持网页逐项填写、Excel 批量导入。\n第二步，「国标测评」会按 2014 修订国标自动算分评级，不需要人工查表。\n第三步，「AI 运动处方」针对得分低于 72 分的项目生成处方，教师审定后签发给学生。\n\n全过程在本机完成，不联网，数据不出校。";
  }

  // 班级薄弱项
  if (/(班级|全班|班里).*(最弱|薄弱|最差|哪几项)|哪几项最弱|最弱的是/.test(q)){
    const st = classStats(STATE.term);
    const sorted = ITEMS.map(i=>({n:i.name, v:st.partAvg[i.key], w:i.w})).sort((a,b)=>a.v-b.v);
    const s = sorted.slice(0,3).map((x,i)=>(i+1)+". "+x.n+"（"+x.v+" 分，权重 "+x.w+"%）").join("\n");
    return "当前测评班级各项目平均分从低到高：\n\n"+s+"\n\n"+sorted[0].n+"是最突出的共性短板，建议在体育课的基本部分集中安排针对性练习，练习密度目标控制在 60% 以上。";
  }

  // 班级统计
  if (/(及格率|优良率|平均分|达标率|班级情况|整体)/.test(q)){
    const st = classStats(STATE.term);
    return "当前测评班级统计：\n\n平均分 "+st.avg+" 分\n优良率 "+st.goodRate+"%（优秀 "+st.lv.优秀+" 人，良好 "+st.lv.良好+" 人）\n及格率 "+st.passRate+"%\n不及格 "+st.lv.不及格+" 人\n\n国标规定学年总分良好及以上方可参加评优评奖，建议重点盯住临近 80 分的学生。";
  }

  // 某学生：进步比较
  if (named && /(进步|上次|变化|提高|退步|第三次|对比)/.test(q)){
    const a = getScore(named,"t1"), b = getScore(named, STATE.term);
    const d = Math.round((b.total-a.total)*10)/10;
    let detail = "";
    ITEMS.forEach(i=>{
      const dv = b.parts[i.key].score - a.parts[i.key].score;
      if (Math.abs(dv) >= 5) detail += "\n· "+itemName(named.gender,i.key)+"：" +a.parts[i.key].score+" → "+b.parts[i.key].score+"（"+(dv>0?"+":"")+dv+"）";
    });
    return named.name+"总分从 "+a.total+" 提升到 "+b.total+"，累计 "+(d>0?"+":"")+d+" 分，等级由 "+a.level+" 变为 "+b.level+"。\n\n变化较大的项目：" + (detail || "无单项变化超过 5 分") +
      "\n\n下一步建议保持当前训练节奏，把重点放在尚未到 80 分的项目上。";
  }

  // 某学生：处方
  if (named && /(处方|怎么练|训练|练什么|提升)/.test(q)){
    const rx = makePrescription(named, STATE.term);
    const sc = getScore(named, STATE.term);
    if (rx.keep){
      return named.name+"本次总分 "+sc.total+"（"+sc.level+"），各项目均在 72 分以上，无需针对性补弱。建议维持现有锻炼习惯，以优势项目带动全面发展。";
    }
    let s = named.name+"总分 "+sc.total+"（"+sc.level+"），薄弱项为：\n\n";
    s += rx.focus.map(f=>"· "+f.name+" "+f.score+" 分").join("\n");
    s += "\n\n【"+rx.items[0].name+"】"+rx.items[0].lib.title+"\n";
    rx.items[0].lib.items.forEach(it=>{ s += "\n· "+it.t+"：" + it.d; });
    s += "\n\n"+rx.items[0].lib.tip;
    return s;
  }

  // 某学生：总览
  if (named){
    const sc = getScore(named, STATE.term);
    const parts = ITEMS.map(i=>i.name+" "+sc.parts[i.key].score).join("，");
    const sorted = ITEMS.map(i=>({n:itemName(named.gender,i.key), v:sc.parts[i.key].score})).sort((a,b)=>a.v-b.v);
    return named.name+"（"+named.id+"，"+(named.gender==="M"?"男":"女")+"）本次测评：\n\n总分 "+sc.total+" 分，"+"等级 "+sc.level+"\nBMI "+sc.bmi+"（"+sc.bmiGrade+"）\n\n各单项得分："+parts+"\n\n最弱的一项是"+sorted[0].n+"（"+sorted[0].v+" 分）。输入“"+named.name+" 怎么练”可以获取处方。";
  }

  // 单个项目怎么练
  const itemsMap = [
    [/耐力|1000|800|跑步|长跑/, "endur"], [/体前屈|柔韧/, "reach"], [/引体|上肢/, "pullup"],
    [/仰卧起坐|核心|腹肌/, "situp"], [/跳远|爆发力|弹跳/, "jump"], [/50 米|短跑|速度|起跑/, "run50"],
    [/肺活量|心肺/, "vc"], [/体重|BMI|超重|肥胖|偏瘦|体型/, "bmi_high"]
  ];
  for (const r of itemsMap){
    if (r[0].test(q)){
      const lib = RX_LIB[r[1]];
      let s = "【"+lib.title+"】\n\n";
      lib.items.forEach(it=>{ s += "· "+it.t+"：" + it.d + "\n"; });
      s += "\n"+lib.tip;
      s += "\n\n想针对某位学生生成完整处方，请告诉我他的姓名，或到「AI 运动处方」板块查看。";
      return s;
    }
  }

  // 关于这个系统本身
  if (/(AI|人工智能|怎么实现|原理|技术上|系统)/.test(q)){
    return "这套系统由三层组成：\n\n一是确定性计算层，按国标评分表查表算分，这部分不需要 AI，但最需要准确。\n二是知识库层，运动处方和问答都由本地知识库支撑，离线可跑。\n三是交互层，页面、图表和操作流程。\n\nAI 参与的是第二层和第三层的搭建过程，以及评分表的结构化转换。登录求详解请看「AI 溯源」板块，那里逐项列出了 AI 做了什么、人改了什么。";
  }

  return "这个问题我暂时答不上来。我可以帮你查：\n\n· 某个学生的总分、单项得分、BMI（直接说姓名）\n· 学生跨学期的进步对比\n· 针对薄弱项的运动处方\n· 班级平均分、及格率、优良率\n· 某个项目的训练方法\n\n例如试试输入「"+STUDENTS[5].name+" 的薄弱项」。";
}

      .then(function(stream){
        CAM = stream;

          const v = document.getElementById("camVideo");

    const c = newCanvas();
    if (!c){ STATE.camErr = "此浏览器不支持画布，无法抓帧。"; this.go("capture"); return; }
    try {
      const w = v.videoWidth, h = v.videoHeight;
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(v, 0, 0, w, h);
      const url = c.toDataURL("image/jpeg", 0.82);
      STATE.photo = { src:url, w:w, h:h, kb: Math.max(1, Math.round(url.length * 0.75 / 1024)) };
      STATE.camErr = "";
      this.camClose(false);
      if (STATE.served) uploadPhoto(STATE.photo, { name: curStuName(), stuId: STATE.stuId });

  camPick(input){

    if (!f) return;
    if (!/^image\//.test(f.type)){ STATE.camErr = "请选择图片文件（JPG / PNG）。"; input.value = ""; this.go("capture"); return; }
    if (typeof FileReader === "undefined"){ STATE.camErr = "此环境不支持读取本地文件。"; input.value = ""; this.go("capture"); return; }
    const rd = new FileReader(), self = this;
    rd.onload = function(ev){
      const url = String(ev.target.result);
      const im = new Image();
      im.onload = function(){
        STATE.photo = { src:url, w:im.width, h:im.height, kb: Math.max(1, Math.round(f.size/1024)) };
        STATE.camErr = "";
        if (STATE.served) uploadPhoto(STATE.photo, { name: curStuName(), stuId: STATE.stuId });
        self.go("capture");
      };
      im.onerror = function(){ STATE.camErr = "图片解析失败，请换一张重试。"; input.value = ""; self.go("capture"); };
      im.src = url;
    };
    rd.onerror = function(){ STATE.camErr = "图片读取失败。"; input.value = ""; self.go("capture"); };
    rd.readAsDataURL(f);
  },

        done = document.execCommand("copy");
        document.body.removeChild(ta);
      } catch(e){ err = e.message; done = false; }
    }
    STATE.copyMsg = done
      ? "第 " + (i+1) + " 条（" + p.stage + "）原文已复制到剪贴板，可直接粘贴进开发应用报告。"
      : "复制失败" + (err ? "：" + err : "") + "，请展开后手动选中文本框内容复制。";
    this.go("trace");
  },
  /* ---------- 扫码进入 ---------- */
  fillLoginQR(){
    var el = document.getElementById("loginQR");
    if (!el) return;
    if (!STATE.served){
      el.innerHTML = '<div class="qr-note">本机直接打开（file://）时无法生成可扫码的局域网地址。<br>评委 / 学生可直接点下方按钮以访客身份体验：</div>'
        + '<button class="login-guest-btn" style="margin-top:12px" onclick="UI.enterGuest()">以访客身份体验（无需扫码）</button>'
        + '<div class="qr-tip" style="margin-top:10px">如需演示「手机扫码 → 拍照 → 大屏同步」：用自己手机开「个人热点」，本机连该热点后运行 <b>启动校园访问.py</b>，即可生成可扫码的局域网地址（不依赖任何校园网）。</div>';
      return;
    }
    var url = guestUrl();
    el.innerHTML = '<div class="qr-card"><div class="qr-cap">扫码在手机 / 平板上打开（访客模式）</div>'
      + qrSvg(url, 172, 3)
      + '<div class="qr-url">'+escapeHtml(url)+'</div>'
      + '<div class="qr-tip">手机、平板、希沃大屏扫同一个码，将以<b>访客身份自动进入</b>，可直接体验全部功能。</div></div>';
  },
  openQR(){
    var b = document.getElementById("qrModalBody");
    var m = document.getElementById("qrModal");
    if (b){
      if (STATE.served){
        var u = guestUrl();
        b.innerHTML = qrSvg(u, 240, 4)
          + '<div class="qr-url" style="margin-top:12px">'+escapeHtml(u)+'</div>'
          + '<ol class="steps" style="margin-top:14px"><li>用手机 / 平板相机扫码，将<b>以访客身份自动进入</b>（无需输密码）。</li>'
          + '<li>可自由体验：查看班级画像、本人运动处方、做训练打卡、向处方顾问提问。</li>'
          + '<li>在「多模态采集」拍照或选图，照片会<b>实时同步到大屏</b>。</li></ol>'
          + '<div class="qr-tip">访客模式为只读体验，操作不影响正式演示数据；多人扫码各自独立、不会互相冲突。</div>';
      } else {
        b.innerHTML = '<div class="qr-note">当前以本机文件方式打开，未连接任何服务器，无法生成局域网二维码。</div>'
          + '<button class="login-guest-btn" style="margin-top:12px" onclick="UI.enterGuest()">以访客身份体验（无需扫码）</button>'
          + '<ol class="steps" style="margin-top:14px"><li>评委 / 学生点「以访客身份体验」即可进入系统，自动分配独立账号，只读浏览，操作不影响演示数据。</li>'
          + '<li>若想演示「手机扫码 → 拍照 → 大屏同步」：用自己手机开「个人热点」，本机连该热点后运行 <b>启动校园访问.py</b>，再扫顶栏二维码（全程不依赖校园网）。</li></ol>';
      }
    }
    if (m) m.classList.add("on");
  },
  closeQR(){
    var m = document.getElementById("qrModal");
    if (m) m.classList.remove("on");
  },
  /* ---------- 访客模式：扫码自动进入，按标签页分配独立账号 ---------- */
  enterGuest(){
    var g = this._guestIdentity();
    STATE.user = { id:"guest", name:g.account, role:"guest", color:g.color };
    STATE.role = "guest";
    STATE.stuId = selfStudent().id;
    STATE.genderFilter = "";
    var mask = document.getElementById("loginMask");
    if (mask) mask.className = "login-mask off";
    var bar = document.getElementById("guestBar");
    if (bar){
      bar.style.display = "block";
      bar.innerHTML = '<b>访客模式</b>：您已自动登录为 <b>'+escapeHtml(g.account)+'</b>，密码 <b>'+escapeHtml(g.pwd)+'</b>（仅本机可用，可自由体验）。您的操作不会影响正式演示数据。'
        + '<span class="gb-x" onclick="UI.closeGuestBar()" title="收起">&times;</span>';
    }
  },
  _guestIdentity(){
    try {
      var raw = sessionStorage.getItem("guestToken");
      if (raw){ var o = JSON.parse(raw); if (o && o.account) return o; }
    } catch(e){}
    var n = String(Math.floor(100 + Math.random() * 900));   // 三位数编号
    var o = { account: "访客" + n, pwd: this._randPwd(6), color: "#0ea5e9" };
    try { sessionStorage.setItem("guestToken", JSON.stringify(o)); } catch(e){}
    return o;
  },
  _randPwd(len){
    var s = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";   // 去掉易混字符 I O 0 1
    var r = "";
    for (var i = 0; i < len; i++) r += s.charAt(Math.floor(Math.random() * s.length));
    return r;
  },
  closeGuestBar(){
    var b = document.getElementById("guestBar");
    if (b) b.style.display = "none";
  }
};

/* ---------------- 12. 启动 ---------------- */
(function init(){
  Store.init();
  Checkin.init();
  STATE.served = !!shareUrl();
  try { document.body.classList.toggle("clean", STATE.clean); } catch(e){}
  var params = null;
  try { params = new URLSearchParams(location.search); } catch(e){ params = null; }
  var isGuest = !!(params && params.get && params.get("guest") === "1");
  if (isGuest){
    UI.enterGuest();
  } else {
    UI.loginRender();
    UI.fillLoginQR();
    UI.pickAccount("teacher");
  }
  UI.nav();
  UI.roles();
  UI.chip();
  UI.mode();
  UI.go("home");
  window.UI = UI;
})();
</script>
</body>
